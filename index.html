.tile-art { position: relative; width: 100%; height: 100px; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 85%, rgba(66, 83, 214, .6), rgba(255,255,255,.02) 70%); }
.tile-art .rick { width: 86px; max-width: none; align-self: start; margin-top: 22px; }
.tile-art.hat .rick { width: 100px; margin-top: 14px; }
.tile-ic { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; background: var(--violet); box-shadow: 0 4px 0 var(--violet-deep); transform: rotate(-4deg); }
.tile-ic .ico { width: 32px; height: 32px; }
.tile-ic.kit { width: auto; padding: 0 12px; display: flex; gap: 6px; }
.tile-ic.kit .ico { width: 24px; height: 24px; }
.owned-badge { position: absolute; top: 8px; right: 8px; background: var(--sun); color: #23200F; font-family: var(--f-display); font-weight: 800; font-size: 13px; border-radius: 99px; padding: 2px 9px; }
.tile.bundle { border-color: var(--sun); background: rgba(255, 194, 51, .1); }
.save-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%) rotate(-3deg); z-index: 2; background: var(--coral); color: var(--on-accent); font-family: var(--f-display); font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
.shop-grid .tile.bundle { margin-top: 6px; }
.tile-status { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 99px; background: rgba(255,255,255,.1); color: #DDE1FF; line-height: 1.3; }
.tile-status .ico { width: 15px; height: 15px; }
.tile.buy .tile-status { background: var(--sun); color: #23200F; box-shadow: 0 2px 0 var(--sun-deep); }
.tile.buy .tile-status .ico { background: #FFE9A6; border-radius: 50%; }
.tile.short .tile-status { color: #9AA0C8; }
.tile.owned .tile-status { background: rgba(255,255,255,.18); color: #fff; }
.tile.equipped { border-color: var(--mint); background: rgba(61, 203, 149, .14); }
.tile.equipped .tile-status { background: var(--mint); color: var(--on-accent); }
.tile.equipped .tile-status .ico { stroke-width: 3; }
.tile.locked .tile-art { filter: grayscale(.85) brightness(.65); }
.tile.locked .tile-status { background: transparent; color: #C9CEF5; font-weight: 400; font-size: 12px; padding: 0; }
.tile-curtain { position: relative; width: 100%; height: 100%; display: flex; justify-content: space-between; background: radial-gradient(circle at 50% 25%, rgba(66, 83, 214, .7), #12153D 75%); }
.tile-curtain span { width: 44%; background: repeating-linear-gradient(90deg, var(--a) 0 8px, var(--b) 12px, var(--a) 16px); }
.tile-curtain span:first-child { clip-path: polygon(0 0, 100% 0, 62% 55%, 40% 100%, 0 100%); }
.tile-curtain span:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 60% 100%, 38% 55%); }
.shop-foot { flex: none; padding: 12px 20px 16px; background: var(--stage-2); border-top: 1px solid rgba(255,255,255,.08); display: flex; justify-content: flex-end; }

/* =========================================================
   PLAY EXTRAS: mode strip, combo, leave box, streak burst
   ========================================================= */
.qpanel { position: relative; overflow: hidden; }
.qpanel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--qc, var(--cobalt)); }
.qpanel.rescue { --qc: var(--coral); } .qpanel.fixit { --qc: var(--violet); } .qpanel.lab { --qc: var(--teal); }
.combo { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px 4px 8px; border-radius: 99px; background: linear-gradient(90deg, #FF9A3D, #FF5B4A); color: #fff; font-family: var(--f-mono); font-size: 12px; box-shadow: 0 2px 0 #B8361F; }
.combo b { font-family: var(--f-display); font-size: 15px; }
.combo .ico { width: 16px; height: 16px; animation: flicker .8s ease-in-out infinite alternate; }
.combo.cold { background: var(--paper-2); color: var(--muted); box-shadow: none; }
.combo.cold .ico { animation: none; }
.combo.pump { animation: pump .55s cubic-bezier(.3,1.8,.5,1); }
@keyframes pump { 40% { transform: scale(1.35) rotate(-4deg); } }
.leavebox { margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: var(--coral-soft); border: 2px solid var(--coral); display: grid; gap: 10px; animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
.burst { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; overflow: hidden; }
.burst::before {
  content: ""; position: absolute; width: 150%; aspect-ratio: 1; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 220, 120, .28) 0 10deg, transparent 10deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 12%, transparent 60%); mask: radial-gradient(circle, #000 12%, transparent 60%);
  animation: burstRays 1.6s ease forwards;
}
.burst span { position: relative; font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 5vw, 48px); color: var(--sun); white-space: nowrap;
  text-shadow: 0 3px 0 var(--sun-deep), 0 6px 0 #6B4A00, 0 12px 24px rgba(0,0,0,.6); animation: burstText 1.6s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes burstText { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 20% { transform: scale(1.15) rotate(-6deg); opacity: 1; } 75% { transform: scale(1) rotate(-6deg); opacity: 1; } 100% { transform: scale(1.05) rotate(-6deg) translateY(-24px); opacity: 0; } }
@keyframes burstRays { 0% { transform: scale(.3) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1) rotate(70deg); opacity: 0; } }

/* =========================================================
   PROP BOX (episode end)
   ========================================================= */
.propbox { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px 18px; border-radius: 22px;
  background: linear-gradient(135deg, var(--sun-soft), var(--card)); border: 2px solid var(--sun); }
.chest { position: relative; isolation: isolate; background: none; border: 0; padding: 0; width: 124px; }
.chest-svg { width: 100%; display: block; overflow: visible; }
.ch-shadow { fill: rgba(0,0,0,.18); }
.ch-wood { fill: #A0602E; } .ch-wood-dark { fill: #7A4520; }
.ch-band { fill: var(--sun); stroke: var(--sun-deep); stroke-width: 1.5; }
.ch-lock { fill: #FFD45E; stroke: var(--sun-deep); stroke-width: 2; } .ch-keyhole { fill: #3A2418; }
.ch-edge { stroke: #6B3A18; stroke-width: 3; }
.ch-lid { transform-box: fill-box; transform-origin: 6% 100%; transition: transform .55s cubic-bezier(.3,1.6,.5,1); }
.chest:not(.open):not(.shake) { animation: chestIdle 2.6s ease-in-out infinite; }
@keyframes chestIdle { 0%, 78%, 100% { transform: none; } 84% { transform: rotate(-5deg) translateY(-3px); } 90% { transform: rotate(5deg) translateY(-3px); } 95% { transform: rotate(-2deg); } }
.chest.shake { animation: chestShake .7s ease; }
@keyframes chestShake { 0%, 100% { transform: none; } 15% { transform: rotate(-9deg) scale(1.05); } 30% { transform: rotate(9deg) scale(1.08); } 45% { transform: rotate(-9deg) scale(1.1); } 60% { transform: rotate(9deg) scale(1.12); } 80% { transform: rotate(-4deg) scale(1.1); } }
.chest.open .ch-lid { transform: translate(-4px, -16px) rotate(-30deg); }
.chest.open::before { content: ""; position: absolute; left: 50%; top: 42%; width: 200px; height: 200px; margin: -100px 0 0 -100px; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 226, 140, .9), transparent 65%); animation: fade .4s ease; }
.pb-txt b { font-family: var(--f-display); font-size: 21px; display: block; }
.pb-txt > span { color: var(--muted); }
.pb-prizes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.prize { display: inline-flex; gap: 7px; align-items: center; padding: 7px 14px 7px 10px; border-radius: 99px; background: var(--violet); color: var(--on-accent); font-weight: 700; animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
.prize.coins { background: var(--sun); color: #23200F; }
.prize .ico { width: 18px; height: 18px; }
.prize + .prize { animation-delay: .18s; }

/* badge progress */
.bprog { width: 80%; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 2px; }
.bprog span { display: block; height: 100%; background: var(--cobalt); border-radius: 99px; }
.bnum { font-family: var(--f-mono); font-size: 11px !important; }

/* =========================================================

button, .choice, .tile, .node, .lab-opt, .lvlbtn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.modal { max-height: calc(100dvh - 40px); }

}
@media (min-width: 1500px) { #screen { max-width: 1280px; } }

  .ticket { margin-top: -30px; }

  .daily .btn { justify-self: stretch; }
  .propbox { grid-template-columns: 96px minmax(0, 1fr); }

/* =========================================================
   MOTION POLISH
   ========================================================= */
/* screen entrances */
#screen.enter > :not(.theater) { animation: riseIn .55s cubic-bezier(.2,.8,.2,1) both; }
#screen.enter > :nth-child(2) { animation-delay: .05s; } #screen.enter > :nth-child(3) { animation-delay: .1s; }
#screen.enter > :nth-child(4) { animation-delay: .15s; } #screen.enter > :nth-child(n+5) { animation-delay: .2s; }
#screen.enter .play > .stage { animation: riseIn .5s cubic-bezier(.2,.8,.2,1) both; }
#screen.enter .play > .panel { animation: riseIn .5s cubic-bezier(.2,.8,.2,1) .08s both; }
#screen.enter .choices > .choice, #screen.enter .lab-row { animation: slideIn .45s cubic-bezier(.2,.8,.2,1) both; }
#screen.enter .choices > .choice:nth-child(1), #screen.enter .lab-row:nth-child(1) { animation-delay: .2s; }
#screen.enter .choices > .choice:nth-child(2), #screen.enter .lab-row:nth-child(2) { animation-delay: .27s; }
#screen.enter .choices > .choice:nth-child(3), #screen.enter .lab-row:nth-child(3) { animation-delay: .34s; }
#screen.enter .choices > .choice:nth-child(4) { animation-delay: .41s; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } }
.feedback > * { animation: riseIn .45s cubic-bezier(.2,.8,.2,1) both; }
.feedback > :nth-child(2) { animation-delay: .08s; } .feedback > :nth-child(3) { animation-delay: .16s; }
.feedback > :nth-child(4) { animation-delay: .24s; } .feedback > :nth-child(n+5) { animation-delay: .32s; }
#screen.enter .road .node { animation: popIn .45s cubic-bezier(.3,1.6,.5,1) both; }
#screen.enter .road .node:nth-child(n) { animation-delay: calc(.2s + var(--i, 0) * .04s); }
@keyframes popIn { from { opacity: 0; transform: scale(.6); } }

/* shine on the right answer */
.choice.is-best { overflow: hidden; }
.choice.is-best::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent); transform: skewX(-18deg);
  animation: shine 1s ease .15s both;
}
@keyframes shine { to { left: 130%; } }
/* periodic shine on the hero button */
.btn.shine { position: relative; overflow: hidden; }
.btn.shine::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 35%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent); transform: skewX(-18deg);
  animation: shineLoop 4.5s ease-in-out 2.4s infinite;
}
@keyframes shineLoop { 0% { left: -60%; } 25%, 100% { left: 130%; } }
/* HUD reactions */
.coinchip.bump { animation: coinBump .5s cubic-bezier(.3,1.8,.5,1); }
@keyframes coinBump { 30% { transform: scale(1.22) rotate(-6deg); } 60% { transform: scale(.96) rotate(3deg); } }
#rank-fill.glow { animation: barGlow 1.1s ease; }
@keyframes barGlow { 0%, 100% { box-shadow: none; filter: none; } 40% { box-shadow: 0 0 12px 2px rgba(255, 210, 100, .9); filter: brightness(1.25); } }
/* twinkling stage dust */
.stage::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 28% 64%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 46% 14%, #FFE39A, transparent), radial-gradient(1px 1px at 63% 48%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 78% 26%, #fff, transparent), radial-gradient(1px 1px at 88% 70%, #FFE39A, transparent),
    radial-gradient(1px 1px at 36% 38%, #fff, transparent), radial-gradient(1.5px 1.5px at 56% 78%, #fff, transparent);
  animation: twinkleField 5s ease-in-out infinite alternate;
}
@keyframes twinkleField { from { opacity: .2; } to { opacity: .7; } }
/* Rick glances around when idle */
.rick.idle[data-mood="talk"] .r-pupil { animation: glance 7s ease-in-out infinite; }
@keyframes glance { 0%, 40%, 100% { transform: none; } 45%, 58% { transform: translate(-2.5px, 0); } 63%, 76% { transform: translate(2.5px, -1px); } }
.bubble.react.bad { animation: pop .35s cubic-bezier(.3,1.6,.5,1), shake .4s ease .35s; }

/* =========================================================
   LANDING (simplified)
   ========================================================= */
.cta-sub { display: inline-flex; align-items: center; gap: 8px; color: #C9CEF5; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: -4px; }
.cta-sub .ico { color: var(--sun); }
.howto-strip { list-style: none; margin: 26px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
.howto-strip li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; counter-increment: step;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.howto-strip b { display: block; font-family: var(--f-display); font-size: 17px; }
.howto-strip li > div > span { color: var(--muted); font-size: 14px; line-height: 1.35; display: block; }
.howto-strip .st-ic { color: #fff; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ql {
  position: relative; display: grid; align-content: start; justify-items: start; gap: 4px; text-align: left; padding: 16px; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); color: var(--ink);
  transition: transform .12s, border-color .12s;
}
.ql:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--qc); }
.ql:disabled { opacity: .55; cursor: default; }
.ql-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--qc); color: #fff; margin-bottom: 6px; transform: rotate(-4deg); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.ql-ic .ico { width: 24px; height: 24px; }
.ql b { font-family: var(--f-display); font-size: 18px; line-height: 1.15; }
.ql > span:last-child { color: var(--muted); font-size: 14px; line-height: 1.35; }
.section-head { align-items: end; }
.section-head .section-sub { margin: 0; max-width: 46ch; }
.modes.compact { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.modes.compact .mode-card { padding: 18px; gap: 14px; align-content: space-between; }
.modes.compact .mode-card::before { width: 120px; height: 120px; right: -36px; top: -36px; }
.mc-top { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; }
.modes.compact .mode-icon { width: 46px; height: 46px; border-radius: 14px; }
.modes.compact .mode-icon .ico { width: 24px; height: 24px; }
.modes.compact h3 { font-size: 19px; line-height: 1.1; }
.modes.compact .tagline { font-size: 14px; margin-top: 2px; }
.modes.compact .lvl-row { margin-top: 0; gap: 6px; }
.modes.compact .lvlbtn { padding: 6px 11px; font-size: 14px; flex: 1; }

/* =========================================================
   TEACHER SNAPSHOT
   ========================================================= */
.modal.report {
  width: min(900px, 100%); padding: 0; gap: 0; text-align: left; justify-items: stretch; color: var(--ink);
  background: var(--paper); display: flex; flex-direction: column; overflow: hidden;
  max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
}
.rp-head { position: relative; display: flex; justify-content: space-between; gap: 16px; padding: 22px 24px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
.rp-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--mint), var(--cobalt), var(--violet), var(--coral)); }
.rp-head .eyebrow { color: var(--mint); }
.rp-head h2 { font-size: 30px; color: var(--ink); }
.rp-head .note { max-width: 60ch; }
.rp-x { color: var(--ink); border-color: var(--line); background: var(--paper); }
.rp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 20px; display: grid; gap: 18px; align-content: start; }
.rp-name { display: grid; gap: 6px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); max-width: 420px; }
.rp-name input { font-family: var(--f-body); font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.rp-name input:focus { outline: none; border-color: var(--mint); }
.rp-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rp-kpi { display: grid; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.rp-kpi-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--mint-soft); color: var(--mint); margin-bottom: 4px; }
.rp-kpi-ic .ico { width: 17px; height: 17px; }
.rp-kpi b { font-family: var(--f-display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rp-kpi > span:last-child { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rp-cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.rp-cols h3 { font-size: 18px; margin: 0 0 10px; }
.rp-cols section { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; overflow-x: auto; }
.rp-side h3 + * { margin-bottom: 16px; }
.rp-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.rp-table th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 6px 8px; border-bottom: 1px solid var(--line); }
.rp-table td { padding: 8px 6px; border-bottom: 1px dashed var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
.rp-table td:first-child { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.rp-table tr:last-child td { border-bottom: 0; }
.cat-ic.sm { width: 26px; height: 26px; border-radius: 8px; flex: none; }
.cat-ic.sm .ico { width: 14px; height: 14px; }
.pill { display: inline-block; white-space: nowrap; font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; padding: 3px 8px; border-radius: 99px; background: var(--paper-2); color: var(--muted); }
.pill.best { background: var(--mint-soft); color: var(--mint); } .pill.ok { background: var(--amber-soft); color: var(--amber); } .pill.weak { background: var(--coral-soft); color: var(--coral); }
.rp-miss, .rp-modes, .rp-recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rp-miss li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--coral-soft); }
.rp-miss li span { font-family: var(--f-mono); font-size: 12px; color: var(--coral); }
.rp-strong { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
.rp-strong .ico { color: var(--sun-deep); }
.rp-modes li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
.rp-modes li b { font-family: var(--f-display); font-size: 17px; }
.rp-modes li small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.rp-recent li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: center; }
.rp-recent .rp-t { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-recent small { grid-column: 2; color: var(--muted); font-size: 12px; }
.rp-text { width: 100%; font-family: var(--f-mono); font-size: 12px; border: 2px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card); color: var(--ink); }
.rp-actions { flex: none; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; padding: 14px 24px; background: var(--card); border-top: 1px solid var(--line); }
@media print {
  body > :not(#modal) { display: none !important; }
  body { background: #fff; }
  .modal-scrim { position: static; background: none; padding: 0; display: block; }
  .modal.report { max-height: none; overflow: visible; box-shadow: none; width: 100%; animation: none; }
  .rp-body { overflow: visible; }
  .rp-actions, .rp-x, #rp-copybox { display: none !important; }
}

/* =========================================================
   DICTIONARY (interactive)
   ========================================================= */
.dict-modes { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--paper-2); border: 1px solid var(--line); }
.seg button { display: inline-flex; gap: 6px; align-items: center; border: 0; background: transparent; border-radius: 10px; padding: 7px 13px; font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.seg .ico { width: 16px; height: 16px; }
.sortbtn { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 700; color: var(--ink); }
.sortbtn .ico { width: 15px; height: 15px; color: var(--muted); }
.fc-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.dtools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tool { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 5px 12px; font-size: 14px; font-weight: 700; color: var(--ink); }
.tool .ico { width: 16px; height: 16px; color: var(--cobalt); }
.tool:hover { border-color: var(--cobalt); }
.dcat-tag { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); }
.dcat-tag .ico { width: 14px; height: 14px; }
.ddetail mark, .flash mark { background: linear-gradient(transparent 55%, rgba(255, 194, 51, .7) 55%); color: inherit; padding: 0 1px; border-radius: 2px; }
.vs { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: start; }
.vs-badge { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 800; font-size: 13px; }
.vs b { display: block; }
.vs span { color: var(--muted); }
.dpractice { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: var(--cobalt-soft); }
.dpractice b { display: block; font-size: 15px; }
.dpractice span { font-size: 14px; color: var(--muted); }
.flash { display: grid; gap: 14px; padding-top: 6px; }
.flash-card {
  position: relative; display: grid; gap: 12px; justify-items: start; padding: 22px 20px; min-height: 260px; align-content: center;
  background: var(--card); border: 2px solid var(--line); border-top: 8px solid var(--cc); border-radius: 22px; box-shadow: var(--shadow);
  animation: cardIn .4s cubic-bezier(.2,.8,.2,1);
}
.flash.flipped .flash-card { animation: flipIn .45s cubic-bezier(.2,.8,.2,1); background: linear-gradient(var(--card), var(--paper)); }
@keyframes cardIn { from { opacity: 0; transform: translateX(30px) rotate(2deg); } }
@keyframes flipIn { 0% { transform: perspective(800px) rotateY(80deg); opacity: .3; } 100% { transform: none; opacity: 1; } }
.flash-q { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.flash .ex { width: 100%; font-family: var(--f-display); font-weight: 600; font-size: 19px; background: var(--paper); border-radius: 14px; padding: 14px 16px; border: 1.5px solid var(--line); }
.flash .ex.big { font-size: 21px; line-height: 1.35; }
.flash-name { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--cc); }
.flash-name small { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 8px; }
.flash-short { font-size: 17px; }
.flash-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

@media (max-width: 900px) {
  .howto-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modes.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rp-cols { grid-template-columns: minmax(0, 1fr); }
  .rp-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .howto-strip { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .modes.compact { grid-template-columns: minmax(0, 1fr); }
  .quick { gap: 10px; }
  .ql { padding: 14px 12px; }
  .ql b { font-size: 16px; }
  .rp-head, .rp-body, .rp-actions { padding-left: 16px; padding-right: 16px; }
  .rp-head h2 { font-size: 24px; }
  .rp-actions .btn { flex: 1; }
  .flash-name { font-size: 28px; }
}
@media (max-height: 600px) {
  .modal.report { overflow-y: auto; }
  .rp-body { flex: none; overflow: visible; }
}
@media (max-width: 640px), (max-height: 600px) {
  .drawer-tools .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .drawer-tools .chips::-webkit-scrollbar { display: none; }

  .drawer-head { padding: 14px 16px 12px; }
  .drawer-tools, .drawer-body { padding-left: 16px; padding-right: 16px; }
}

<script>
/* ===== data/dictionary.js ===== */
/* =========================================================
   RHETORIC RICK — Rhetorical Devices Dictionary
   Every entry uses the same shape so new entries can be added
   without touching the game engine.

   id          unique key used by the question banks
   name        display name
   say         pronunciation help (optional)
   aka         other names (optional)
   cat         category key (see RR_CATEGORIES)
   short       one-line definition (used in answer buttons & tooltips)
   definition  full, student-friendly definition
   example     an original example line
   how         how the device works / what to look for
   effect      likely effect on an audience
   useWhen     when a speaker might choose it
   watchOut    caution or common misconception
   vs          { id, note } — the term it's most often confused with
   ========================================================= */

window.RR_CATEGORIES = [
  { id: "figurative", name: "Figurative Language", blurb: "Comparisons and vivid pictures that make ideas easier to see and feel." },
  { id: "structure",  name: "Sound & Structure",   blurb: "Patterns of sound, words, and sentence shape that make ideas stick." },
  { id: "engage",     name: "Talking to the Audience", blurb: "Questions and word choices that pull listeners into the conversation." },
  { id: "appeals",    name: "The Big Appeals",     blurb: "Ethos, pathos, logos, and the tools that build trust, feeling, and reasons." },
  { id: "moves",      name: "Argument Moves",      blurb: "Strategic choices for handling disagreement and framing an issue." },
  { id: "redflags",   name: "The Red Flag Files",  blurb: "Misleading moves. Learn to spot them, question them, and avoid using them." }
];

window.RR_DICT = [
  /* ---------------- FIGURATIVE LANGUAGE ---------------- */
  {
    id: "metaphor", name: "Metaphor", say: "MET-uh-for", cat: "figurative",
    short: "Says one thing IS another thing to show what they share.",
    definition: "A comparison that describes one thing as if it actually were something else, without using \"like\" or \"as.\"",
    example: "\"Our school library is a doorway to a thousand worlds.\"",
    how: "Look for a sentence that says X is Y (or treats X as Y) when that can't be literally true. The library isn't a real door, but it shares a quality with one: it leads you somewhere new.",
    effect: "It turns an abstract idea into a picture. The audience feels the shared quality instead of just hearing about it.",
    useWhen: "You want an idea to feel bigger, clearer, or more meaningful in just a few words.",
    watchOut: "A metaphor makes a claim memorable, but it doesn't prove it. A great comparison still needs evidence behind it.",
    vs: { id: "simile", note: "A simile says one thing is LIKE or AS another. A metaphor drops those words and says it simply IS the other thing." }
  },
  {
    id: "simile", name: "Simile", say: "SIM-uh-lee", cat: "figurative",
    short: "Compares two things using \"like\" or \"as.\"",
    definition: "A comparison between two different things that uses the word \"like\" or \"as.\"",
    example: "\"Without a plan, our fundraiser will be like a ship without a captain.\"",
    how: "Find the words \"like\" or \"as\" connecting two things that aren't normally compared.",
    effect: "It explains something unfamiliar by connecting it to something the audience already knows.",
    useWhen: "Your audience needs a quick, clear picture of what you mean.",
    watchOut: "Not every \"like\" is a simile. \"I like pizza\" is not a comparison. The two things being compared must be different kinds of things.",
    vs: { id: "metaphor", note: "Both compare. A simile uses \"like\" or \"as\"; a metaphor says one thing IS the other." }
  },
  {
    id: "personification", name: "Personification", say: "per-SON-if-ih-KAY-shun", cat: "figurative",
    short: "Gives human actions or feelings to something that isn't human.",
    definition: "Describing an object, animal, or idea as if it could think, feel, speak, or act like a person.",
    example: "\"The broken swing set groans every time someone sits on it, begging for a repair.\"",
    how: "Look for a non-human thing doing something only people do: begging, crying, whispering, complaining, waiting.",
    effect: "It makes the audience care about a thing the way they'd care about a person. A neglected object starts to feel like it needs help.",
    useWhen: "You want an audience to feel sympathy for a place, object, or problem.",
    watchOut: "It works best when it's brief. Too much can sound silly to a serious audience.",
    vs: { id: "metaphor", note: "Metaphor says one thing IS another. Personification specifically gives something human qualities." }
  },
  {
    id: "hyperbole", name: "Hyperbole", say: "hy-PER-buh-lee", cat: "figurative",
    short: "Huge exaggeration on purpose, for emphasis or humor.",
    definition: "A deliberate, obvious exaggeration that isn't meant to be taken literally.",
    example: "\"I've been waiting in this lunch line for a million years.\"",
    how: "Ask: is this impossible or wildly overstated? If the speaker clearly doesn't mean it literally, it's hyperbole.",
    effect: "It shows strong feeling (frustration, excitement) and often gets a laugh.",
    useWhen: "The audience is relaxed and you want energy, humor, or emphasis.",
    watchOut: "Hyperbole can hurt your credibility when the audience expects exact facts, like a budget committee or a fact-checker.",
    vs: { id: "logos", note: "Logos uses real evidence. Hyperbole uses exaggeration you're not supposed to take literally." }
  },
  {
    id: "imagery", name: "Imagery", say: "IM-ij-ree", cat: "figurative",
    short: "Description that appeals to the five senses.",
    definition: "Language that helps the audience see, hear, smell, taste, or feel something in their imagination.",
    example: "\"Picture it: the smell of fresh basil, tomatoes warm from the sun, and bees humming over the flowers.\"",
    how: "Look for sensory details: colors, sounds, smells, textures, tastes. Speakers often begin with \"Picture this\" or \"Imagine.\"",
    effect: "The audience experiences the idea instead of just hearing about it, which makes it more real and memorable.",
    useWhen: "You want people to imagine a place, a result, or an experience.",
    watchOut: "A beautiful picture isn't a plan. Decision-makers will still ask how, how much, and who.",
    vs: { id: "pathos", note: "Imagery is a tool (sensory description). Pathos is the goal (emotion). Imagery often creates pathos." }
  },
  {
    id: "analogy", name: "Analogy", say: "uh-NAL-uh-jee", cat: "figurative",
    short: "Explains an idea by walking through a similar situation.",
    definition: "An extended comparison that explains how one situation works by showing how it matches another situation the audience already understands.",
    example: "\"A coach doesn't use a new play in a game without practicing it first. A new phone policy should work the same way: explain it, test it, then adjust.\"",
    how: "An analogy usually takes more than a few words. It lays out a familiar situation, then says the new situation works the same way.",
    effect: "It makes a new or complicated problem feel familiar and logical.",
    useWhen: "Your audience doesn't know much about your topic but knows a lot about something similar.",
    watchOut: "Check whether the two situations are really alike in the ways that matter. A weak analogy can sound smart and still be wrong.",
    vs: { id: "simile", note: "A simile is a quick comparison (\"like a ship\"). An analogy builds a longer comparison to make an argument." }
  },
  {
    id: "symbolism", name: "Symbolism", say: "SIM-buh-liz-um", cat: "figurative",
    short: "Uses an object or action to stand for a bigger idea.",
    definition: "Using a concrete object, image, or action to represent an idea larger than itself.",
    example: "Rick hands every new club member a small seed packet: \"This is what we're growing here, and it starts with you.\"",
    how: "Ask: is this object meant to be about more than itself? A seed packet standing for growth is symbolism.",
    effect: "It gives the audience something they can see or hold that reminds them of the message.",
    useWhen: "You want a message to last after the speech is over.",
    watchOut: "If the audience doesn't get the connection, the symbol falls flat. Make it clear.",
    vs: { id: "metaphor", note: "A metaphor is made of words. A symbol is usually a real object or action that stands for an idea." }
  },

  /* ---------------- SOUND & STRUCTURE ---------------- */
  {
    id: "alliteration", name: "Alliteration", say: "uh-LIT-er-AY-shun", cat: "structure",
    short: "Repeats the same starting consonant sound in nearby words.",
    definition: "The repetition of the same beginning consonant sound in words that are close together.",
    example: "\"Find your favorite book at the Fall Fair!\"",
    how: "Read it aloud and listen to the first sounds of the words. Repeating sounds (F-F-F) means alliteration. It's about sound, not spelling: \"phone\" and \"fun\" alliterate.",
    effect: "It makes a phrase catchy, rhythmic, and easy to remember.",
    useWhen: "Slogans, posters, titles, and closing lines that you want people to repeat.",
    watchOut: "Catchy isn't the same as convincing. Alliteration grabs attention, but it doesn't give reasons.",
    vs: { id: "repetition", note: "Repetition repeats whole words or phrases. Alliteration repeats only the starting sound." }
  },
  {
    id: "repetition", name: "Repetition", say: "rep-ih-TISH-un", cat: "structure",
    short: "Repeats a word or phrase to drive a point home.",
    definition: "Using the same word, phrase, or idea several times so the audience remembers it.",
    example: "\"Be on time. Being on time shows respect. When we're on time, the whole team gets more done.\"",
    how: "Look for a key word or phrase that keeps coming back. If it always comes at the start of each sentence, that's the more specific device anaphora.",
    effect: "It tells the audience, \"This is the part that matters,\" and helps the message stick.",
    useWhen: "You have one central idea you want the audience to walk away with.",
    watchOut: "Repeating a claim doesn't make it truer. Repetition without new information can sound like nagging.",
    vs: { id: "anaphora", note: "Anaphora is a specific kind of repetition: the same words at the BEGINNING of each sentence or clause." }
  },
  {
    id: "anaphora", name: "Anaphora", say: "uh-NAF-or-uh", cat: "structure",
    short: "Repeats the same words at the START of each sentence or phrase.",
    definition: "Repeating a word or phrase at the beginning of several sentences or clauses in a row.",
    example: "\"We need safer crosswalks. We need brighter streetlights. We need a park where every family feels welcome.\"",
    how: "Check the beginnings of the sentences. If they start the same way (\"We need… We need… We need…\"), it's anaphora.",
    effect: "It builds rhythm and momentum, like a drumbeat, and makes a list of points feel connected and powerful.",
    useWhen: "Speeches and rallies where you want to build energy toward a big finish.",
    watchOut: "It's powerful in a speech but can feel over the top in a short written note.",
    vs: { id: "epistrophe", note: "Anaphora repeats at the BEGINNING. Epistrophe repeats at the END." }
  },
  {
    id: "epistrophe", name: "Epistrophe", say: "eh-PIS-truh-fee", cat: "structure",
    short: "Repeats the same word or phrase at the END of each sentence or phrase.",
    definition: "Repeating a word or phrase at the end of several sentences or clauses in a row.",
    example: "\"This club should be run by students, for students, and with students.\"",
    how: "Look at how each phrase ENDS. If the same word lands at the end each time, it's epistrophe.",
    effect: "The repeated ending gets the most emphasis. It's the word the audience will remember.",
    useWhen: "You want one key word to echo in the audience's mind.",
    watchOut: "Easy to confuse with anaphora. Ask: is the repeat at the front or the back?",
    vs: { id: "anaphora", note: "Epistrophe repeats at the END; anaphora repeats at the BEGINNING." }
  },
  {
    id: "parallelism", name: "Parallelism", say: "PAIR-uh-lel-iz-um", cat: "structure",
    short: "Uses the same grammar pattern for related ideas.",
    definition: "Putting related ideas into matching grammatical patterns so they feel balanced.",
    example: "\"We need clearer signs, wider sidewalks, and safer crossings.\"",
    how: "Look for phrases built the same way, like adjective + noun, adjective + noun, adjective + noun, or verb + object, verb + object.",
    effect: "Ideas feel organized, balanced, and easy to follow.",
    useWhen: "You're listing several reasons or requests and want them to sound clear and connected.",
    watchOut: "Parallelism shows up inside many other devices (rule of three, antithesis). Ask what the MAIN effect is.",
    vs: { id: "repetition", note: "Parallelism repeats a grammar PATTERN. Repetition repeats the actual WORDS." }
  },
  {
    id: "rule_of_three", name: "Rule of Three", aka: "Tricolon", cat: "structure",
    short: "Groups ideas in threes because three feels complete.",
    definition: "Presenting three related words, phrases, or ideas together for rhythm and emphasis.",
    example: "\"Our recycling plan is simple, cheap, and fast.\"",
    how: "Count the items. Three related items in a row, especially in a slogan or conclusion, often signals the rule of three.",
    effect: "Three items feel complete and satisfying. They're easy to remember and sound confident.",
    useWhen: "Slogans, safety rules, and conclusions people need to remember.",
    watchOut: "Don't stretch to find a third point. A weak third item weakens the whole list.",
    vs: { id: "parallelism", note: "The rule of three is about the NUMBER of items. Parallelism is about matching GRAMMAR. They often appear together." }
  },
  {
    id: "antithesis", name: "Antithesis", say: "an-TITH-uh-sis", cat: "structure",
    short: "Puts opposite ideas side by side in a balanced sentence.",
    definition: "Placing two contrasting ideas next to each other, usually in matching sentence structures.",
    example: "\"Littering takes a second; cleaning it up takes all afternoon.\"",
    how: "Look for opposites (a second / all afternoon; build / break; easy / hard) set up in a balanced pattern.",
    effect: "The contrast makes the difference sharp and memorable, and it often frames a choice.",
    useWhen: "You want the audience to clearly see the difference between two options or outcomes.",
    watchOut: "If the speaker claims those are the ONLY two options when they aren't, a contrast can turn into a false dilemma.",
    vs: { id: "false_dilemma", note: "Antithesis highlights a contrast. A false dilemma wrongly claims there are only two choices." }
  },
  {
    id: "climax", name: "Climax", aka: "Building to a peak", cat: "structure",
    short: "Arranges ideas from least to most important.",
    definition: "Ordering words or ideas so that each one is bigger or more important than the last.",
    example: "\"We can fix one classroom, then improve a whole school, then change how our entire district thinks about access.\"",
    how: "Notice whether the items grow in size, importance, or intensity as the sentence goes on.",
    effect: "It builds momentum and leaves the biggest idea ringing in the audience's ears.",
    useWhen: "Ending a speech or a paragraph on your strongest point.",
    watchOut: "If the last step is too big a leap, the audience may stop believing you.",
    vs: { id: "rule_of_three", note: "Rule of three is about having three items. Climax is about putting items in rising order." }
  },
  {
    id: "chiasmus", name: "Chiasmus", say: "ky-AZ-mus", cat: "structure",
    short: "Flips the order of words in the second half (A-B, B-A).",
    definition: "Repeating ideas in reverse order, creating a mirror pattern (A-B / B-A).",
    example: "\"We shape our habits, and then our habits shape us.\"",
    how: "Look for two key words that swap places: shape → habits / habits → shape.",
    effect: "The mirror pattern feels clever and wise, and it's very quotable.",
    useWhen: "A memorable closing line or a big idea about cause and effect.",
    watchOut: "It can sound too slick or rehearsed in casual conversation.",
    vs: { id: "antithesis", note: "Antithesis contrasts opposites. Chiasmus reverses the order of the same words." }
  },

  /* ---------------- TALKING TO THE AUDIENCE ---------------- */
  {
    id: "rhetorical_question", name: "Rhetorical Question", cat: "engage",
    short: "A question asked to make a point, not to get an answer.",
    definition: "A question asked to make the audience think, where the answer is meant to be obvious.",
    example: "\"If a park belongs to everyone, shouldn't everyone be able to use it?\"",
    how: "Ask: does the speaker really expect someone to raise a hand and answer? If the answer is implied (\"Yes, of course!\"), it's rhetorical.",
    effect: "The audience answers in their own head, so it feels like their idea instead of a lecture.",
    useWhen: "Your audience might resist being told what to think.",
    watchOut: "A question isn't proof. The implied answer still needs support.",
    vs: { id: "hypophora", note: "A rhetorical question leaves the answer unspoken. Hypophora asks a question and then answers it out loud." }
  },
  {
    id: "hypophora", name: "Hypophora", say: "hy-POF-or-uh", cat: "engage",
    short: "Asks a question, then answers it right away.",
    definition: "When a speaker raises a question and then immediately answers it themselves.",
    example: "\"Why should we care about the creek? Because it's where our drinking water starts.\"",
    how: "Look for a question followed directly by the speaker's own answer.",
    effect: "It builds a little curiosity, then satisfies it, so the speaker controls the explanation.",
    useWhen: "You want to guide the audience through your reasoning step by step.",
    watchOut: "If the question is one nobody was actually asking, it can feel staged.",
    vs: { id: "rhetorical_question", note: "Hypophora answers its own question. A rhetorical question leaves the answer for the audience." }
  },
  {
    id: "direct_address", name: "Direct Address", cat: "engage",

    fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, i === 3 ? 0.6 : 0.16, "triangle", 0.13)),
    whoosh: () => tone(300, 0, 0.25, "sine", 0.05, 3),
    blip: () => tone(1200, 0, 0.03, "square", 0.015),
    coin: () => { tone(988, 0, 0.08, "square", 0.05); tone(1319, 0.07, 0.22, "square", 0.05); },
    erase: () => tone(900, 0, 0.18, "sawtooth", 0.04, 0.4),
    rattle: () => [0, 0.08, 0.16, 0.24].forEach(t => tone(180 + Math.random() * 60, t, 0.06, "square", 0.04)),
    chest: () => { [523, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.06, 0.25, "triangle", 0.1)); },
    combo: () => { tone(784, 0, 0.1, "square", 0.05); tone(1047, 0.08, 0.1, "square", 0.05); tone(1568, 0.16, 0.25, "square", 0.05); }
  };
  window.sfx = (name, arg) => { if (S.on && SFX[name]) try { SFX[name](arg); } catch (e) {} };
  window.soundOn = () => S.on;
  window.toggleSound = () => {
    S.on = !S.on;
    try { localStorage.setItem("rr-sound", S.on ? "on" : "off"); } catch (e) {}
    if (S.on) sfx("click");
    return S.on;
  };

  /* ---------------- Motion preference ---------------- */
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.calmMotion = calm;

  /* ---------------- Confetti ---------------- */
  let cv, cx2, parts = [], raf = 0;
  const COLORS = ["#FFC233", "#E5483C", "#2D44D2", "#0F8A63", "#8291FF", "#FF9E3D", "#7A4DE0"];
  function loop() {
    cx2.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p => {
      p.vy += 0.25 * p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      cx2.save(); cx2.globalAlpha = Math.min(1, p.life / 30);
      cx2.translate(p.x, p.y); cx2.rotate(p.r); cx2.fillStyle = p.c;
      if (p.round) { cx2.beginPath(); cx2.arc(0, 0, p.w / 2, 0, 7); cx2.fill(); }
      else cx2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
      cx2.restore();
    });
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!parts.length) cx2.clearRect(0, 0, cv.width, cv.height);
  }
  window.confetti = (x, y, n = 60, spread = 1) => {
    if (calm()) return;
    if (!cv) {
      cv = document.createElement("canvas"); cv.className = "confetti";
      document.body.appendChild(cv); cx2 = cv.getContext("2d");
      const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx2.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
      fit(); addEventListener("resize", fit);
    }
    x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * spread;
      const v = 6 + Math.random() * 9;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.7 + Math.random() * 0.6,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 10 + Math.random() * 6,
        c: COLORS[i % COLORS.length], life: 90 + Math.random() * 50, round: Math.random() < 0.25 });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  };
  window.confettiFrom = (el, n, spread) => {
    const r = el.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, n, spread);
  };

  /* ---------------- Floating "+XP" text ---------------- */
  window.floatText = (el, text, cls = "") => {
    const r = el.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "float-xp " + cls;
    f.textContent = text;
    f.style.left = r.left + r.width / 2 + "px";
    f.style.top = r.top + "px";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1300);
  };

  /* ---------------- Count-up number ---------------- */
  window.countUp = (el, from, to, ms = 700) => {
    if (calm() || from === to) { el.textContent = to; return; }
    const t0 = performance.now();
    const step = t => {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  /* ---------------- Typewriter (click to skip) ---------------- */
  window.typeInto = (el, text, rick, onDone) => {
    if (calm()) { el.textContent = text; onDone && onDone(); return () => {}; }
    let i = 0, stopped = false, timer;
    el.textContent = "";
    el.classList.add("typing");
    if (rick) rick.classList.add("talking");
    const finish = () => {
      if (stopped) return;
      stopped = true; clearTimeout(timer);
      el.textContent = text; el.classList.remove("typing");
      if (rick) rick.classList.remove("talking");
      onDone && onDone();
    };
    const tick = () => {
      if (stopped) return;
      if (!el.isConnected) { stopped = true; if (rick) rick.classList.remove("talking"); return; }
      i++;
      el.textContent = text.slice(0, i);
      if (i % 3 === 0) sfx("blip");
      if (i >= text.length) return finish();
      const ch = text[i - 1];
      timer = setTimeout(tick, /[.,!?:;]/.test(ch) ? 140 : 22);
    };
    el.addEventListener("click", finish, { once: true });
    timer = setTimeout(tick, 250);
    return finish;
  };
})();

</script>

  /* Lay the episode medals out as a winding road and draw the path through them. */
  function layoutRoad() {
    const road = $("#road");
    if (!road) return;
    const grid = road.querySelector(".road-grid");
    const nodes = [...grid.querySelectorAll(".node")];
    const w = grid.clientWidth;
    const cols = w >= 880 ? 6 : w >= 600 ? 4 : w >= 400 ? 3 : 2;
    grid.style.setProperty("--cols", cols);
    nodes.forEach((n, i) => {
      const row = Math.floor(i / cols), c = i % cols;
      n.style.gridRow = row + 1;
      n.style.gridColumn = (row % 2 ? cols - 1 - c : c) + 1;
    });
    const box = road.getBoundingClientRect();
    const pts = nodes.map(n => {
      const m = n.querySelector(".medal").getBoundingClientRect();
      return [m.left + m.width / 2 - box.left, m.top + m.height / 2 - box.top];
    });
    const build = upto => {
      let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
      for (let i = 1; i <= upto; i++) {
        const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
        if (Math.abs(y1 - y2) < 4) d += ` L${x2.toFixed(1)} ${y2.toFixed(1)}`;
        else {
          const dir = x1 > box.width / 2 ? 1 : -1, bulge = Math.min(70, box.width * 0.08);
          d += ` C${(x1 + dir * bulge).toFixed(1)} ${y1.toFixed(1)} ${(x2 + dir * bulge).toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        }
      }
      return d;
    };
    const svg = $("#road-svg");
    svg.setAttribute("viewBox", `0 0 ${box.width.toFixed(0)} ${box.height.toFixed(0)}`);
    const full = build(pts.length - 1);
    const doneUpto = Math.min(S.epUnlocked, pts.length - 1);
    svg.innerHTML = `<path class="r-base" d="${full}"/>${doneUpto > 0 ? `<path class="r-done" d="${build(doneUpto)}"/>` : ""}<path class="r-dash" d="${full}"/>`;
  }
  let roadTimer;
  addEventListener("resize", () => { clearTimeout(roadTimer); roadTimer = setTimeout(layoutRoad, 80); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutRoad);

  /* =========================================================
     STARTING RUNS
     ========================================================= */
  function startEpisode(e) {
    const ep = RR_EPISODES[e];
    const k = RR_EPISODES.slice(0, e).filter(x => x.mode === ep.mode).length;
    const queue = BANK[ep.mode].slice(k * PER_EP, k * PER_EP + PER_EP).map(q => ({ q, mode: ep.mode }));
    const bonusMode = ep.mode === "detective" ? "fixit" : "lab";
    const bq = BANK[bonusMode][k];
    if (bq) queue.push({ q: bq, mode: bonusMode, bonus: true });
    run = { kind: "campaign", ep: e, queue, i: 0, results: [], bonusRating: null, hints: 0, coins: 0 };
    renderEpisodeIntro();
  }

  function startFree(mode, level) {
    const pool = BANK[mode].filter(q => !level || q.level === level).map(q => ({ q, mode }));
    run = { kind: "free", mode, level, pool, queue: shuffle(pool), i: 0, results: [], hints: 0, coins: 0 };
    nextQuestion();
  }

  function startDaily() {
    if (dailyDone()) return renderHome();
    run = { kind: "daily", queue: [dailyItem()], i: 0, results: [], hints: 0, coins: 0 };
    nextQuestion();
  }

  function missedIds() {
    return Object.keys(S.history).filter(id => S.history[id].last === "weak" && QBYID[id]);
  }
  function startRematch() {
    const ids = shuffle(missedIds());
    if (!ids.length) return renderHome();
    run = { kind: "rematch", queue: ids.map(id => QBYID[id]), i: 0, results: [], hints: 0, coins: 0 };
    nextQuestion();
  }
