<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhetoric Rick</title>
<meta name="description" content="A persuasion strategy game: spot Rick's rhetorical devices, then pick the right strategy for every audience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout concept: a theater. Rick performs on a curtained stage under marquee lights; the challenge card sits beside the stage. On phones the stage compresses into a banner above the card. */
:root {
  --paper: #F1F3FB;
  --paper-2: #E7EAF7;
  --card: #FFFFFF;
  --ink: #171A36;
  --muted: #555B80;
  --line: #D7DCF0;
  --cobalt: #2D44D2;
  --on-cobalt: #FFFFFF;
  --cobalt-soft: #E4E8FF;
  --sun: #FFC233;
  --sun-deep: #C98A00;
  --sun-soft: #FFF2CC;
  --coral: #E0463A;
  --coral-soft: #FCE1DD;
  --mint: #0E8A62;
  --mint-soft: #D8F3E7;
  --amber: #A86400;
  --amber-soft: #FDEACC;
  --violet: #6B45D6;
  --violet-soft: #ECE6FF;
  --teal: #0B7E8C;
  --teal-soft: #D9F2F4;
  --on-accent: #FFFFFF;
  --cobalt-deep: #1B2C96; --coral-deep: #9E2A21; --mint-deep: #075C41; --amber-deep: #6E4100;
  --violet-deep: #4527A0; --teal-deep: #055A64; --line-deep: #AEB5D6;

  /* the theater (same in both themes) */
  --stage: #1B1F55;
  --stage-2: #12153D;
  --stage-glow: #4253D6;
  --curtain: #A11D33;
  --curtain-dark: #5C0D1C;
  --bulb: #FFE39A;
  --floor: #6B3F2A;
  --floor-2: #57321F;
  --bar: #12153D;
  --bar-ink: #F1F3FF;
  --bar-muted: #A9AFDA;

  --skin: #F0C29A;
  --hair: #4A2A1C;
  --shirt: #E0463A;

  --f-display: "Bricolage Grotesque", "Arial Black", "Helvetica Neue", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r: 16px;
  --shadow: 0 1px 0 rgba(23, 26, 54, .05), 0 12px 30px -16px rgba(23, 26, 54, .35);
  --lift: 0 4px 0 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1027; --paper-2: #13173A; --card: #181C3D; --ink: #EDEFFF; --muted: #A4A9CF; --line: #2B3162;
    --cobalt: #8796FF; --on-cobalt: #0D1030; --cobalt-soft: #222A60;
    --sun: #FFCB4A; --sun-deep: #D49A12; --sun-soft: #3A321B;
    --coral: #FF7F72; --coral-soft: #44212B; --mint: #3DCB95; --mint-soft: #133A30;
    --amber: #F2AC45; --amber-soft: #3B2E16; --violet: #A98BFF; --violet-soft: #2C2357;
    --teal: #4BC7D4; --teal-soft: #12363D; --on-accent: #0D1030;
    --cobalt-deep: #4A58C8; --coral-deep: #B3463C; --mint-deep: #1F8A62; --amber-deep: #A86F1C;
    --violet-deep: #6E52C2; --teal-deep: #22808A; --line-deep: #1C2148;
    --bar: #090B20;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 32px -16px rgba(0,0,0,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1027; --paper-2: #13173A; --card: #181C3D; --ink: #EDEFFF; --muted: #A4A9CF; --line: #2B3162;
  --cobalt: #8796FF; --on-cobalt: #0D1030; --cobalt-soft: #222A60;
  --sun: #FFCB4A; --sun-deep: #D49A12; --sun-soft: #3A321B;
  --coral: #FF7F72; --coral-soft: #44212B; --mint: #3DCB95; --mint-soft: #133A30;
  --amber: #F2AC45; --amber-soft: #3B2E16; --violet: #A98BFF; --violet-soft: #2C2357;
  --teal: #4BC7D4; --teal-soft: #12363D; --on-accent: #0D1030;
  --cobalt-deep: #4A58C8; --coral-deep: #B3463C; --mint-deep: #1F8A62; --amber-deep: #A86F1C;
  --violet-deep: #6E52C2; --teal-deep: #22808A; --line-deep: #1C2148;
  --bar: #090B20;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 32px -16px rgba(0,0,0,.75);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  background:
    radial-gradient(1200px 500px at 50% -200px, var(--paper-2), transparent 70%),
    var(--paper);
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.06; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
[hidden] { display: none !important; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.eyebrow {
  font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
}

/* =========================================================
   TOP BAR (the studio control strip)
   ========================================================= */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px; background: var(--bar); color: var(--bar-ink);
  box-shadow: 0 2px 0 var(--curtain), 0 10px 24px -14px rgba(0,0,0,.6);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 2px; color: inherit; }
.brand-mark {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px;
  background: var(--coral); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 21px;
  transform: rotate(-7deg); box-shadow: 0 3px 0 var(--curtain-dark);
}
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.hud { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
.rankchip { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank-shield {
  position: relative; width: 34px; height: 38px; flex: none; display: grid; place-items: center;
  color: var(--stage-2); font-family: var(--f-display); font-weight: 800; font-size: 15px;
}
.rank-shield svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rank-shield svg path { fill: var(--sun); stroke: var(--sun-deep); stroke-width: 1.5; }
.rank-shield b { position: relative; padding-top: 2px; }
.rank-meta { display: grid; gap: 3px; min-width: 140px; }
.rank-name { font-family: var(--f-display); font-weight: 700; font-size: 14px; line-height: 1; white-space: nowrap; }
.xpbar { height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
.xpbar span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sun), #FFE39A); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.xpnum { font-family: var(--f-mono); font-size: 11px; color: var(--bar-muted); font-variant-numeric: tabular-nums; line-height: 1; }
.streakchip {
  display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 99px;
  background: rgba(255,255,255,.08); font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--bar-muted);
}
.streakchip.hot { background: rgba(255, 127, 60, .2); color: #FFB37A; }
.streakchip.hot .ico { color: #FF8A3D; animation: flicker .8s ease-in-out infinite alternate; }
@keyframes flicker { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.18) rotate(4deg); } }
.barbtns { display: flex; gap: 6px; }
.barbtn {
  display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
  color: var(--bar-ink); border-radius: 99px; padding: 7px 13px; font-weight: 700; font-size: 15px;
}
.barbtn:hover { background: rgba(255,255,255,.14); border-color: var(--sun); }
.barbtn.icon-only { padding: 7px 9px; }

#screen { max-width: 1180px; margin: 0 auto; padding: 26px 20px 80px; outline: none; }

/* =========================================================
   BUTTONS
   ========================================================= */
.btn {
  --c: var(--cobalt); --c-ink: var(--on-cobalt); --c-deep: var(--cobalt-deep);
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border: 0; border-radius: 14px; padding: 14px 24px; font-weight: 700; font-size: 17px; line-height: 1.1;
  background: var(--c); color: var(--c-ink);
  box-shadow: var(--lift) var(--c-deep), 0 10px 20px -12px rgba(10, 12, 40, .45);
  transition: transform .08s ease, box-shadow .08s ease, filter .15s;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 0 var(--c-deep); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }
.btn.sun { --c: var(--sun); --c-ink: #23200F; --c-deep: var(--sun-deep); }
.btn.coral { --c: var(--coral); --c-ink: var(--on-accent); --c-deep: var(--coral-deep); }
.btn.mint { --c: var(--mint); --c-ink: var(--on-accent); --c-deep: var(--mint-deep); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--cobalt); color: var(--cobalt); }
.btn.ghost-light { background: rgba(255,255,255,.08); color: #fff; border: 2px solid rgba(255,255,255,.3); box-shadow: none; }
.btn.ghost-light:hover { border-color: var(--sun); }
.btn.big { padding: 17px 30px; font-size: 19px; border-radius: 16px; }
.btn.small { padding: 9px 15px; font-size: 15px; border-radius: 11px; --lift: 0 3px 0 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--cobalt); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================
   RICK
   ========================================================= */
.rick { width: 100%; max-width: 200px; aspect-ratio: 170 / 200; transform-origin: 50% 100%; }
.rick-svg { width: 100%; height: auto; display: block; overflow: visible; }
.r-shadow { fill: rgba(0,0,0,.28); }
.r-skin { fill: var(--skin); }
.r-hair { fill: var(--hair); }
.r-hair-shine { fill: none; stroke: rgba(255,255,255,.25); stroke-width: 3; stroke-linecap: round; }
.r-shirt { fill: var(--shirt); }
.r-shirt-shade { fill: rgba(0,0,0,.12); }
.r-collar { fill: #fff; }
.r-tie { fill: var(--sun); }
.r-tie-knot { fill: #E3A400; }
.r-cheek { fill: #F2867A; opacity: .5; }
.r-eyewhite { fill: #fff; }
.r-pupil { fill: #1A1B2E; transition: transform .25s ease; }
.r-glasses { fill: none; stroke: #1A1B2E; stroke-width: 3; stroke-linecap: round; }
.r-brow path { fill: none; stroke: var(--hair); stroke-width: 4.5; stroke-linecap: round; }
.r-mouth { fill: #6B1F2A; }
.r-tongue { fill: #E8707A; }
.r-line { fill: none; stroke: #6B1F2A; stroke-width: 3.5; stroke-linecap: round; }
.r-mic rect { fill: #2A2D45; }
.r-mic circle { fill: #3B3F5E; }
.r-mic .r-mic-band { fill: var(--sun); }
.r-mic-grid { stroke: #9095BE; stroke-width: 1.4; }
.r-think text { font-family: var(--f-display); font-weight: 800; font-size: 24px; fill: var(--sun); }
.r-sweat { fill: #8FD3FF; }
.r-sparkle path { fill: var(--sun); }
.r-head, .r-arm, .r-eyes, .m-talk { transform-box: fill-box; }
.r-head { transform-origin: 50% 90%; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.r-arm { transform-origin: 0% 100%; transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
.r-eyes { transform-origin: 50% 50%; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
.r-brow, .r-mouth, .r-tongue, .r-line, .r-think, .r-sweat, .r-sparkle { display: none; }
.rick[data-mood="talk"] .b-talk, .rick[data-mood="talk"] .m-talk,
.rick[data-mood="happy"] .b-happy, .rick[data-mood="happy"] .m-happy, .rick[data-mood="happy"] .r-sparkle,
.rick[data-mood="oops"] .b-oops, .rick[data-mood="oops"] .m-oops, .rick[data-mood="oops"] .r-sweat,
.rick[data-mood="stumped"] .b-stumped, .rick[data-mood="stumped"] .m-stumped, .rick[data-mood="stumped"] .r-think,
.rick[data-mood="wow"] .b-wow, .rick[data-mood="wow"] .m-wow { display: inline; }
.rick[data-mood="stumped"] .r-pupil { transform: translate(2px, -3px); }
.rick[data-mood="stumped"] .r-head { transform: rotate(7deg); }
.rick[data-mood="stumped"] .r-think text { animation: bob 1.4s ease-in-out infinite; }
.rick[data-mood="stumped"] .r-think text + text { animation-delay: .3s; }
.rick[data-mood="oops"] .r-pupil { transform: translate(-1px, 2px); }
.rick[data-mood="oops"] .r-head { transform: rotate(-5deg); }
.rick[data-mood="happy"] .r-arm { transform: translate(3px, -7px) rotate(6deg); }
.rick[data-mood="happy"] .r-sparkle path { animation: twinkle 1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.rick[data-mood="wow"] .r-arm { transform: translate(2px, -4px) rotate(3deg); }
.rick.talking .m-talk { transform-origin: 50% 0%; animation: flap .16s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleY(.25); } to { transform: scaleY(1.1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes twinkle { from { transform: scale(.6) rotate(0); opacity: .6; } to { transform: scale(1.15) rotate(25deg); opacity: 1; } }
.rick.bounce { animation: bounce .55s ease; }
.rick.shake { animation: shake .45s ease; }
.rick.idle { animation: breathe 3.2s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-16px) rotate(-3deg); } 65% { transform: translateY(0) rotate(2deg); } }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.015) translateY(-1px); } }

/* =========================================================
   THE THEATER (shared stage pieces)
   ========================================================= */
.stage {
  position: relative; overflow: hidden; border-radius: 24px; color: #fff; isolation: isolate;
  background:
    radial-gradient(60% 55% at 50% 8%, rgba(66, 83, 214, .8), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 30px),
    linear-gradient(var(--stage), var(--stage-2));
  box-shadow: 0 20px 40px -24px rgba(10, 12, 40, .8), inset 0 0 0 1px rgba(255,255,255,.06);
  min-width: 0;
}
.valance {
  position: absolute; left: 0; right: 0; top: 0; height: 30px; z-index: 3; pointer-events: none;
  background:
    radial-gradient(circle at 22px 0, var(--curtain) 21px, transparent 22px) 0 10px / 44px 22px repeat-x,
    linear-gradient(var(--curtain-dark), var(--curtain)) 0 0 / 100% 12px no-repeat;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.35));
}
.valance::after {
  content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--sun) 0 10px, var(--sun-deep) 10px 14px);
}
.curtain {
  position: absolute; top: 0; bottom: 0; width: 15%; z-index: 2; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.25), transparent 30%, rgba(0,0,0,.25) 60%, transparent),
    repeating-linear-gradient(90deg, var(--curtain) 0 12px, var(--curtain-dark) 18px, var(--curtain) 24px);
  background-size: 100% 100%, 24px 100%;
}
.curtain.left { left: 0; clip-path: polygon(0 0, 100% 0, 78% 34%, 46% 62%, 30% 100%, 0 100%); }
.curtain.right { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 70% 100%, 54% 62%, 22% 34%); }
.curtain::after {
  content: ""; position: absolute; top: 58%; width: 26px; height: 9px; border-radius: 5px; background: var(--sun);
  box-shadow: 0 2px 0 var(--sun-deep);
}
.curtain.left::after { left: 38%; transform: rotate(-30deg); }
.curtain.right::after { right: 38%; transform: rotate(30deg); }
.floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 64px; z-index: 0;
  background:
    linear-gradient(rgba(0,0,0,.35), transparent 40%),
    repeating-linear-gradient(90deg, var(--floor) 0 58px, var(--floor-2) 58px 60px);
}
.floor::before {
  content: ""; position: absolute; left: 50%; top: -10px; width: 70%; height: 80px; transform: translateX(-50%);
  background: radial-gradient(50% 45% at 50% 50%, rgba(255, 236, 170, .45), transparent 70%);
}
.beam {
  position: absolute; left: 50%; top: 0; bottom: 40px; width: 60%; transform: translateX(-50%); z-index: 0; pointer-events: none;
  background: linear-gradient(rgba(255, 240, 190, .16), rgba(255, 240, 190, .02));
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
}

.bubble {
  position: relative; background: #fff; color: #171A36; border-radius: 20px; padding: 16px 20px;
  font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.28; letter-spacing: -0.01em;
  box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 16px 30px -18px rgba(0,0,0,.6);
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
  border: 13px solid transparent; border-top-color: #fff; border-bottom: 0;
}
.bubble.quote { padding-top: 24px; }
.bubble.quote .qmark {
  position: absolute; left: 14px; top: -20px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--sun); color: #23200F; box-shadow: 0 3px 0 var(--sun-deep);
}
.bubble.quote .qmark .ico { width: 22px; height: 22px; stroke-width: 2.6; }
.bubble.typing::after { }
.bubble .caret { display: inline-block; width: .5ch; }
.bubble.thought { font-family: var(--f-body); font-weight: 700; font-size: 17px; border-radius: 28px; }
.bubble.thought::after { border: 0; width: 16px; height: 16px; border-radius: 50%; background: #fff; bottom: -22px; }
.bubble.thought::before { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff; left: calc(50% + 12px); bottom: -34px; }
.bubble.small { font-size: 16px; font-family: var(--f-body); font-weight: 400; line-height: 1.45; }
.bubble.react { font-family: var(--f-display); font-size: 18px; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
.bubble.react.good { background: #E4FAEF; } .bubble.react.good::after { border-top-color: #E4FAEF; }
.bubble.react.ok { background: #FFF1D6; } .bubble.react.ok::after { border-top-color: #FFF1D6; }
.bubble.react.bad { background: #FFE6E2; } .bubble.react.bad::after { border-top-color: #FFE6E2; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* =========================================================
   HOME — the theater hero
   ========================================================= */
.theater { padding: 54px 24px 0; display: grid; justify-items: center; gap: 18px; text-align: center; min-height: 560px; }
.theater > :not(.valance):not(.curtain):not(.beam):not(.floor) { position: relative; z-index: 4; }
.marquee {
  position: relative; padding: 26px 46px 30px; border-radius: 22px; max-width: 100%;
  background: linear-gradient(#2A174A, #1A0F33);
  border: 3px solid var(--sun-deep);
  box-shadow: 0 0 0 6px #2A174A, 0 0 50px rgba(255, 210, 110, .35), 0 18px 30px -12px rgba(0,0,0,.7);
}
.marquee::before, .marquee::after {
  content: ""; position: absolute; inset: 6px; border-radius: 16px; padding: 9px; pointer-events: none;
  background: radial-gradient(circle, var(--bulb) 0 3.6px, rgba(255, 227, 154, .35) 4.4px, transparent 6px) 0 0 / 22px 22px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: chase 1s steps(1) infinite;
}
.marquee::after { background-position: 11px 11px; animation-delay: .5s; }
@keyframes chase { 0% { opacity: 1; } 50% { opacity: .25; } }
.mq-top { font-family: var(--f-mono); font-size: 14px; letter-spacing: .5em; color: #FFD6E0; text-transform: uppercase; padding-left: .5em; }
.mq-title {
  font-family: var(--f-display); font-weight: 800; letter-spacing: -0.035em; line-height: .86;
  font-size: clamp(64px, 12vw, 132px); color: var(--sun);
  text-shadow: 0 1px 0 #E8A800, 0 2px 0 #D89A00, 0 3px 0 #C88C00, 0 4px 0 #B67E00, 0 5px 0 #A06E00, 0 6px 0 #8A5E00, 0 12px 20px rgba(0,0,0,.55);
}
.mq-title .r-word { display: block; font-size: .42em; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 0 #C9CDF0, 0 2px 0 #A9AEDF, 0 3px 0 #8A90CC, 0 8px 14px rgba(0,0,0,.5); margin-bottom: .08em; }
.theater .lede { color: #DDE1FF; max-width: 54ch; font-size: 18px; }
.theater .cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.theater-rick { display: grid; grid-template-columns: minmax(0, 300px) auto; align-items: end; gap: 6px; margin-top: 8px; }
.theater-rick .bubble { align-self: center; text-align: left; margin-bottom: 70px; }
.theater-rick .bubble::after { left: auto; right: -13px; top: 50%; bottom: auto; transform: translateY(-50%); border: 13px solid transparent; border-left-color: #fff; border-right: 0; }
.theater-rick .rick { width: 190px; }
.note-light { font-size: 14px; color: #C9CEF5; }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 54px 0 18px; }
.section-title { font-size: clamp(28px, 4vw, 38px); font-weight: 800; }
.section-sub { color: var(--muted); max-width: 62ch; margin-top: 6px; }

/* ---------- The Road (episode map) ---------- */
.road { position: relative; padding: 10px 0 6px; }
.road-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.road-svg .r-base { fill: none; stroke: var(--line); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.road-svg .r-dash { fill: none; stroke: var(--card); stroke-width: 2.5; stroke-dasharray: 2 12; stroke-linecap: round; }
.road-svg .r-done { fill: none; stroke: var(--sun); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.road-grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); row-gap: 34px; column-gap: 10px; }
.node {
  display: grid; justify-items: center; gap: 6px; text-align: center; background: none; border: 0; padding: 4px; color: inherit; min-width: 0;
}
.node .medal {
  position: relative; width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); border: 5px solid var(--cobalt); color: var(--cobalt);
  box-shadow: 0 5px 0 var(--cobalt-deep), 0 14px 22px -12px rgba(0,0,0,.5);
  transition: transform .15s cubic-bezier(.3,1.6,.5,1);
}
.node.rescue .medal { border-color: var(--coral); color: var(--coral); box-shadow: 0 5px 0 var(--coral-deep), 0 14px 22px -12px rgba(0,0,0,.5); }
.node .medal .ico { width: 34px; height: 34px; }
.node .num {
  position: absolute; top: -8px; left: -8px; min-width: 30px; height: 30px; border-radius: 99px; padding: 0 6px;
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px;
  background: var(--ink); color: var(--paper); border: 3px solid var(--paper);
}
.node:hover:not(:disabled) .medal { transform: translateY(-4px) scale(1.04); }
.node:disabled { cursor: not-allowed; }
.node:disabled .medal { background: var(--paper-2); border-color: var(--line); color: var(--muted); box-shadow: 0 5px 0 var(--line); }
.node.done .medal { background: var(--sun-soft); }
.node.current .medal { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 5px 0 var(--cobalt-deep), 0 0 0 0 rgba(255, 194, 51, .7); } 50% { box-shadow: 0 5px 0 var(--cobalt-deep), 0 0 0 12px transparent; } }
.node .here {
  position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 46px; height: 46px; border-radius: 50%; overflow: hidden;
  background: var(--stage); border: 3px solid var(--sun); animation: bob 1.6s ease-in-out infinite;
}
.node .here .rick { width: 64px; max-width: none; margin: -2px 0 0 -12px; }
.node-name { font-weight: 700; font-size: 15px; line-height: 1.2; max-width: 16ch; }
.node-meta { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stars { color: var(--sun); letter-spacing: 1px; font-size: 16px; line-height: 1; display: inline-flex; gap: 1px; }
.stars .off { color: var(--line); }
.stars .ico { width: 16px; height: 16px; fill: currentColor; stroke: none; }

/* ---------- Mode cards ---------- */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.mode-card {
  --mc: var(--cobalt); --mc-soft: var(--cobalt-soft); --mc-deep: var(--cobalt-deep);
  position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px;
  display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow);
}
.mode-card.rescue { --mc: var(--coral); --mc-soft: var(--coral-soft); --mc-deep: var(--coral-deep); }
.mode-card.fixit { --mc: var(--violet); --mc-soft: var(--violet-soft); --mc-deep: var(--violet-deep); }
.mode-card.lab { --mc: var(--teal); --mc-soft: var(--teal-soft); --mc-deep: var(--teal-deep); }
.mode-card::before { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--mc-soft); }
.mode-card > * { position: relative; }
.mode-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--mc); color: var(--on-accent); box-shadow: 0 4px 0 var(--mc-deep, rgba(0,0,0,.3)); transform: rotate(-4deg); }
.mode-icon .ico { width: 28px; height: 28px; }
.mode-card h3 { font-size: 26px; }
.mode-card .tagline { font-family: var(--f-display); font-weight: 700; color: var(--mc); font-size: 18px; }
.mode-card .count { position: absolute; top: 22px; right: 22px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lvl-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.lvlbtn {
  border: 2px solid var(--mc); background: var(--card); color: var(--mc); font-weight: 700; border-radius: 12px; padding: 8px 14px; font-size: 15px;
  box-shadow: 0 3px 0 var(--mc); transition: transform .08s;
}
.lvlbtn:hover { background: var(--mc); color: var(--on-accent); }
.lvlbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mc); }

.rematch {
  margin-top: 18px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  background: var(--card); border: 2px dashed var(--coral); border-radius: 22px; padding: 18px 22px;
}
.rematch .mode-icon { --mc: var(--coral); }
.rematch .txt { flex: 1; min-width: 0; }

/* =========================================================
   PLAY
   ========================================================= */
.play { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 26px; align-items: start; }
.play > * { min-width: 0; }
.play .stage {
  position: sticky; top: calc(76px + env(safe-area-inset-top, 0px));
  display: grid; grid-template-rows: auto 1fr auto; gap: 16px; padding: 46px 22px 0; min-height: 520px;
}
.play .stage .tagline-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; z-index: 4; }
.play .stage .eyebrow { color: #C4CAFF; }
.bubbles { display: flex; flex-direction: column; gap: 24px; position: relative; z-index: 4; min-width: 0; }
.bubbles .bubble.react::after { left: auto; right: 40px; transform: none; }
.stage-rick { position: relative; z-index: 1; display: flex; justify-content: center; align-items: end; }
.stage-rick .rick { max-width: 190px; position: relative; z-index: 1; margin-bottom: 30px; }
.podium {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 2; width: 150px; height: 92px;
  background: linear-gradient(90deg, #3A2418, #6B4430 30%, #7A4F38 50%, #6B4430 70%, #3A2418);
  clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); border-top: 8px solid #8B5E42;
}
.podium::after {
  content: "R"; position: absolute; left: 50%; top: 18px; transform: translateX(-50%); width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; background: var(--sun); color: #3A2418; font-family: var(--f-display); font-weight: 800; font-size: 20px;
  box-shadow: 0 0 0 3px #3A2418, 0 0 0 5px var(--sun-deep);
}
.play .stage .floor { height: 46px; }
.play.rescue .stage-rick .rick { max-width: 150px; margin-bottom: 70px; }
.audience { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 108px; z-index: 3; pointer-events: none; }
.aud-torso, .aud-headc { fill: #0B0D29; }
.aud-hair { fill: #05061A; }
.aud-react { fill: none; stroke: transparent; stroke-width: 2.5; stroke-linecap: round; }
.aud .aud-body { transform-box: fill-box; transform-origin: 50% 100%; }
.audience.reacted .aud.won .aud-torso, .audience.reacted .aud.won .aud-headc { fill: var(--mint); }
.audience.reacted .aud.won.okc .aud-torso, .audience.reacted .aud.won.okc .aud-headc { fill: var(--amber); }
.audience.reacted .aud.won .aud-react { stroke: #05061A; }
.audience.reacted .aud.won .aud-body { animation: cheer .5s ease var(--d) 2 alternate; }
.audience.reacted .aud:not(.won) .aud-body { animation: nope .6s ease var(--d); }
.audience.reacted .aud:not(.won) .aud-torso, .audience.reacted .aud:not(.won) .aud-headc { fill: #2A2E58; }
@keyframes cheer { to { transform: translateY(-9px); } }
@keyframes nope { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); min-width: 0; }
.roundbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.modetag {
  --mc: var(--cobalt); --mc-soft: var(--cobalt-soft);
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500;
  padding: 6px 11px; border-radius: 99px; background: var(--mc-soft); color: var(--mc);
}
.modetag.rescue { --mc: var(--coral); --mc-soft: var(--coral-soft); }
.modetag.fixit { --mc: var(--violet); --mc-soft: var(--violet-soft); }
.modetag.lab { --mc: var(--teal); --mc-soft: var(--teal-soft); }
.modetag.bonus { background: var(--sun); color: #23200F; }
.lvl { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.lvl .dots { letter-spacing: 2px; color: var(--sun-deep); }
.pips { display: flex; gap: 6px; margin-left: auto; }
.pip { width: 28px; height: 10px; border-radius: 99px; background: var(--line); transition: background .3s; }
.pip.done-best { background: var(--mint); }
.pip.done-ok { background: var(--amber); }
.pip.done-weak { background: var(--coral); }
.pip.now { background: var(--cobalt); animation: pipnow 1.2s ease-in-out infinite alternate; }
.pip.bonus { width: 14px; background: transparent; border: 2px dashed var(--sun-deep); }
@keyframes pipnow { to { opacity: .45; } }

.q-title { font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; margin: 4px 0 10px; }
.setting { color: var(--muted); margin-bottom: 20px; max-width: 65ch; }
.setting b { color: var(--ink); }
.ask { font-family: var(--f-display); font-weight: 700; font-size: 21px; line-height: 1.25; margin: 6px 0 14px; display: flex; gap: 10px; align-items: flex-start; }
.ask .ico { color: var(--sun-deep); margin-top: 3px; }

.choices { display: grid; gap: 12px; }
.choices.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice {
  position: relative; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 14px; align-items: center; text-align: left;
  border: 2px solid var(--line); background: var(--card); border-radius: var(--r); padding: 13px 14px;
  box-shadow: 0 4px 0 var(--line);
  transition: border-color .12s, background .12s, transform .1s, box-shadow .1s;
}
.choice:hover:not(:disabled) { border-color: var(--cobalt); transform: translateY(-2px); box-shadow: 0 6px 0 var(--cobalt-soft); }
.choice:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.choice .key {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
  background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 5px;
  font-family: var(--f-display); font-weight: 800; font-size: 19px;
}
.choice .c-name { font-weight: 700; font-size: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.choice .c-sub { color: var(--muted); font-size: 15px; display: block; }
.choice .c-line { display: block; font-size: 16px; margin-top: 3px; }
.choice .c-mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; opacity: 0; transform: scale(.4); transition: all .3s cubic-bezier(.3,1.6,.5,1); }
.choice .c-mark .ico { width: 18px; height: 18px; stroke-width: 3; }
.choice[aria-pressed="true"] { border-color: var(--cobalt); background: var(--cobalt-soft); box-shadow: 0 4px 0 var(--cobalt); }
.choice[aria-pressed="true"] .key { background: var(--cobalt); color: var(--on-cobalt); border-color: var(--cobalt-deep); }
.choice:disabled { cursor: default; }
.choice.is-best { border-color: var(--mint); background: var(--mint-soft); box-shadow: 0 4px 0 var(--mint); }
.choice.is-best .key { background: var(--mint); color: var(--on-accent); border-color: var(--mint-deep); }
.choice.is-best .c-mark { opacity: 1; transform: none; background: var(--mint); color: var(--on-accent); }
.choice.is-ok { border-color: var(--amber); background: var(--amber-soft); box-shadow: 0 4px 0 var(--amber); }
.choice.is-ok .key { background: var(--amber); color: var(--on-accent); border-color: var(--amber-deep); }
.choice.is-ok .c-mark { opacity: 1; transform: none; background: var(--amber); color: var(--on-accent); }
.choice.is-wrong { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 4px 0 var(--coral); animation: shake .4s ease; }
.choice.is-wrong .key { background: var(--coral); color: var(--on-accent); border-color: var(--coral-deep); }
.choice.is-wrong .c-mark { opacity: 1; transform: none; background: var(--coral); color: var(--on-accent); }
.choice.dim { opacity: .5; box-shadow: none; }
.verdict-chip {
  display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 99px; font-weight: 500; line-height: 1.5;
}
.verdict-chip.best { background: var(--mint); color: var(--on-accent); }
.verdict-chip.ok { background: var(--amber); color: var(--on-accent); }
.verdict-chip.weak { background: var(--coral); color: var(--on-accent); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
.actions .spacer { flex: 1; }
.hintbox {
  margin-top: 16px; display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; align-items: start;
  background: var(--sun-soft); border: 2px dashed var(--sun-deep); border-radius: 16px; padding: 12px 14px; font-size: 16px;
  animation: pop .3s cubic-bezier(.3,1.6,.5,1);
}
.hintbox .hi { width: 40px; height: 40px; border-radius: 12px; background: var(--sun); color: #23200F; display: grid; place-items: center; }
.hintbox b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: block; color: var(--amber); }

/* Rescue: audience scan dossier */
.scan { display: grid; gap: 0; margin-bottom: 20px; border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
.scan-row { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 14px; align-items: start; padding: 12px 16px; }
.scan-row + .scan-row { border-top: 1px dashed var(--line); }
.scan-row.aud { background: var(--coral-soft); }
.scan-letter {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
  background: var(--coral); color: var(--on-accent); box-shadow: 0 3px 0 var(--coral-deep);
}
.scan-letter .ico { width: 22px; height: 22px; }
.scan-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.scan-val { min-width: 0; }
.scan-val ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.scan-val li { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 3px 10px; font-size: 15px; }
.scan-row.aud .scan-val b { font-size: 18px; }

/* Fix-It: Rick's draft */
.draft {
  position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 18px 20px 16px; margin-bottom: 18px;
  padding-left: 34px;
  background-image: linear-gradient(90deg, transparent 20px, var(--coral-soft) 20px 22px, transparent 22px);
}
.draft .draft-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.draft .draft-text { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.3; margin-top: 4px; }
.stamp {
  position: absolute; right: 14px; top: -14px; transform: rotate(6deg);
  font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--coral); border: 3px solid var(--coral); border-radius: 8px; padding: 2px 10px; background: var(--card);
}
.goal-line { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; color: var(--muted); }
.goal-line .ico { color: var(--mint); }

/* Audience Lab */
.lab-pool { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
.lab-card { background: var(--teal-soft); color: var(--teal); border-radius: 12px; padding: 7px 12px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
.lab-rows { display: grid; gap: 14px; }
.lab-row { border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; transition: border-color .2s; }
.lab-row.filled { border-color: var(--teal); }
.lab-row.r-best { border-color: var(--mint); background: var(--mint-soft); }
.lab-row.r-ok { border-color: var(--amber); background: var(--amber-soft); }
.lab-row.r-weak { border-color: var(--coral); background: var(--coral-soft); }
.lab-who { display: flex; gap: 12px; align-items: center; }
.lab-who .av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: var(--on-accent); flex: none; }
.lab-who b { font-size: 18px; display: block; line-height: 1.2; }
.lab-who small { color: var(--muted); font-size: 15px; }
.lab-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.lab-opt {
  border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 13px; font-weight: 700; font-size: 15px;
  box-shadow: 0 3px 0 var(--line); transition: transform .08s;
}
.lab-opt:hover:not(:disabled) { border-color: var(--teal); }
.lab-opt[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--on-accent); box-shadow: 0 3px 0 var(--teal-deep); }
.lab-opt:disabled { cursor: default; }
.lab-opt.correct { background: var(--mint); border-color: var(--mint); color: var(--on-accent); box-shadow: none; }
.lab-res { font-size: 16px; display: grid; gap: 4px; }
.lab-res .line { font-family: var(--f-display); font-weight: 600; }

/* =========================================================
   FEEDBACK
   ========================================================= */
.feedback { scroll-margin-top: 150px; margin-top: 24px; display: grid; gap: 14px; animation: rise .4s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fb-banner {
  display: grid; grid-template-columns: 58px minmax(0,1fr) auto; gap: 14px; align-items: center;
  border-radius: 18px; padding: 14px 16px; background: var(--mint-soft); border: 2px solid var(--mint);
}
.fb-banner .fb-ic { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); color: var(--on-accent); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
.fb-banner .fb-ic .ico { width: 32px; height: 32px; stroke-width: 3; }
.fb-banner h3 { font-size: 26px; color: var(--mint); }
.fb-banner p { color: var(--muted); font-size: 15px; }
.fb-banner.ok { background: var(--amber-soft); border-color: var(--amber); } .fb-banner.ok .fb-ic { background: var(--amber); } .fb-banner.ok h3 { color: var(--amber); }
.fb-banner.bad { background: var(--coral-soft); border-color: var(--coral); } .fb-banner.bad .fb-ic { background: var(--coral); } .fb-banner.bad h3 { color: var(--coral); }
.xp-gain { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--ink); white-space: nowrap; text-align: right; line-height: 1.1; }
.xp-gain small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 11px; color: var(--muted); }
.fb-card { border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 6px; }
.fb-card h4 { margin: 0; display: flex; gap: 8px; align-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fb-card h4 .ico { width: 18px; height: 18px; }
.fb-card p { max-width: 68ch; }
.fb-card .big { font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.fb-card.answer { border-color: var(--mint); }
.fb-card.answer h4 { color: var(--mint); }
.fb-card.mistake { background: var(--coral-soft); border-color: transparent; } .fb-card.mistake h4 { color: var(--coral); }
.fb-card.partial { background: var(--amber-soft); border-color: transparent; } .fb-card.partial h4 { color: var(--amber); }
.fb-card.insight { background: var(--cobalt-soft); border-color: transparent; } .fb-card.insight h4 { color: var(--cobalt); }
.fb-card.twist { background: var(--sun-soft); border-color: transparent; } .fb-card.twist h4 { color: var(--amber); }
.fb-cols { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.fb-others { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fb-others li { padding-left: 14px; border-left: 4px solid var(--line); }
.fb-others b { font-weight: 700; }

/* Audience meter */
.meter { display: grid; gap: 6px; padding: 14px 16px; border-radius: 18px; background: var(--paper); border: 1.5px solid var(--line); }
.meter-label { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meter-label b { font-family: var(--f-display); font-size: 22px; color: var(--ink); letter-spacing: 0; }
.meter-track { height: 18px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter-fill { height: 100%; width: 0; border-radius: 99px; transition: width 1.1s cubic-bezier(.2,.8,.2,1);
  background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 8px, transparent 8px 16px); }
.meter-fill.best { background-color: var(--mint); }
.meter-fill.ok { background-color: var(--amber); }
.meter-fill.weak { background-color: var(--coral); }

/* =========================================================
   SPLASH (episode intro / end / session end)
   ========================================================= */
.splash { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 32px; align-items: center; max-width: 1000px; margin: 8px auto 0; }
.splash > * { min-width: 0; }
.splash .stage { min-height: 440px; display: flex; flex-direction: column; justify-content: flex-end; padding: 50px 22px 0; gap: 16px; }
.splash .stage .stage-rick .rick { margin-bottom: 26px; }
.splash .copy { display: grid; gap: 16px; }
.epcard { display: flex; align-items: center; gap: 16px; }
.ep-medal {
  width: 74px; height: 74px; border-radius: 22px; flex: none; display: grid; place-items: center; transform: rotate(-5deg);
  background: var(--cobalt); color: var(--on-accent); box-shadow: 0 5px 0 var(--cobalt-deep);
}
.ep-medal.rescue { background: var(--coral); box-shadow: 0 5px 0 var(--coral-deep); }
.ep-medal .ico { width: 38px; height: 38px; }
.epnum-big { font-family: var(--f-mono); color: var(--coral); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; }
.ep-outline {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(64px, 10vw, 110px); line-height: .8; letter-spacing: -0.04em;
  color: transparent; -webkit-text-stroke: 2px var(--line); margin-bottom: -18px;
}
.splash h1 { font-size: clamp(38px, 6vw, 62px); font-weight: 800; }
.howto { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 14px; align-items: start; }
.howto .mode-icon { width: 44px; height: 44px; border-radius: 13px; }
.howto .mode-icon .ico { width: 22px; height: 22px; }
.scoreline { display: flex; gap: 26px; flex-wrap: wrap; }
.scoreline div { display: grid; }
.scoreline b { font-family: var(--f-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; font-weight: 800; }
.scoreline span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.big-stars { display: flex; gap: 10px; }
.big-stars .bs { width: 64px; height: 64px; color: var(--line); }
.big-stars .bs .ico { width: 100%; height: 100%; fill: currentColor; stroke: var(--line-deep); stroke-width: 1; }
.big-stars .bs.on { color: var(--sun); animation: starpop .5s cubic-bezier(.3,1.8,.5,1) both; }
.big-stars .bs.on .ico { stroke: var(--sun-deep); filter: drop-shadow(0 4px 0 var(--sun-deep)); }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.result-strip { display: flex; gap: 8px; flex-wrap: wrap; }
.result-strip span {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--on-accent);
}
.result-strip .best { background: var(--mint); } .result-strip .ok { background: var(--amber); } .result-strip .weak { background: var(--coral); }
.result-strip .bonus { background: var(--sun); color: #23200F; }
.result-strip .ico { width: 20px; height: 20px; stroke-width: 3; }
.newbadges { display: flex; gap: 10px; flex-wrap: wrap; }
.badge-pill {
  display: inline-flex; gap: 8px; align-items: center; background: var(--sun-soft); border: 2px solid var(--sun);
  border-radius: 99px; padding: 6px 14px 6px 6px; font-weight: 700; font-size: 15px; animation: pop .4s cubic-bezier(.3,1.6,.5,1) both;
}
.badge-pill .mini { width: 28px; height: 28px; border-radius: 50%; background: var(--sun); color: #23200F; display: grid; place-items: center; }
.badge-pill .mini .ico { width: 16px; height: 16px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* =========================================================
   PROGRESS
   ========================================================= */
.prog-hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-bottom: 26px; }
.prog-shield { width: 96px; height: 108px; position: relative; display: grid; place-items: center; flex: none; }
.prog-shield svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.prog-shield svg path { fill: var(--sun); stroke: var(--sun-deep); stroke-width: 1.2; }
.prog-shield b { position: relative; font-family: var(--f-display); font-weight: 800; font-size: 40px; color: #23200F; padding-top: 4px; }
.prog-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
.mastery { display: grid; gap: 14px; }
.mastery-row { display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 12px; align-items: center; }
.cat-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: var(--on-accent); background: var(--cc, var(--cobalt)); }
.cat-ic .ico { width: 20px; height: 20px; }
.mastery-row .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 16px; }
.mastery-row .top span:last-child { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mbar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.mbar span { display: block; height: 100%; border-radius: 99px; }
.mbar span.low { background: var(--coral); } .mbar span.mid { background: var(--amber); } .mbar span.high { background: var(--mint); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 12px; }
.badge { border-radius: 18px; padding: 14px 10px; display: grid; gap: 6px; text-align: center; justify-items: center; background: var(--paper); border: 1.5px dashed var(--line); }
.medal-svg { width: 62px; height: 74px; position: relative; display: grid; place-items: center; }
.medal-svg .ribbon { position: absolute; top: 0; width: 40px; height: 32px; left: 11px;
  background: linear-gradient(90deg, var(--line) 0 33%, var(--paper-2) 33% 66%, var(--line) 66%); clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%); }
.medal-svg .disc { position: absolute; bottom: 0; left: 4px; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: var(--line); color: var(--muted); border: 4px solid var(--paper-2); }
.medal-svg .disc .ico { width: 24px; height: 24px; }
.badge.earned { background: var(--sun-soft); border: 1.5px solid var(--sun); }
.badge.earned .ribbon { background: linear-gradient(90deg, var(--coral) 0 33%, #fff 33% 66%, var(--cobalt) 66%); }
.badge.earned .disc { background: radial-gradient(circle at 35% 30%, #FFE7A0, var(--sun) 60%); color: #3A2A00; border-color: var(--sun-deep); box-shadow: 0 3px 0 var(--sun-deep); }
.badge b { font-size: 15px; line-height: 1.2; }
.badge small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.danger-zone { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.confirm-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.note { font-size: 14px; color: var(--muted); }

/* =========================================================
   DICTIONARY DRAWER
   ========================================================= */
.drawer-scrim { position: fixed; inset: 0; background: rgba(8, 10, 30, .55); z-index: 40; backdrop-filter: blur(2px); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(580px, 100%);
  background: var(--paper); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: -20px 0 50px -20px rgba(0,0,0,.6); animation: slidein .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px 14px; background: var(--bar); color: var(--bar-ink); }
.drawer-head .eyebrow { color: var(--sun); }
.drawer-title { font-size: 24px; display: flex; gap: 10px; align-items: center; }
.iconbtn { border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: inherit; border-radius: 12px; width: 42px; height: 42px; display: grid; place-items: center; flex: none; }
.iconbtn:hover { border-color: var(--sun); }
.drawer-tools { padding: 14px 20px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.searchwrap { position: relative; }
.searchwrap .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
#dict-search { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 11px 14px 11px 42px; background: var(--card); }
#dict-search:focus { border-color: var(--cobalt); outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; gap: 6px; align-items: center;
  border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 11px; font-size: 14px; font-weight: 700;
}
.chip .ico { width: 15px; height: 15px; color: var(--cc, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed="true"] .ico { color: inherit; }
.drawer-body { overflow-y: auto; padding: 14px 20px 30px; display: grid; gap: 10px; align-content: start; }
.dcat { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.dcat .cat-ic { width: 32px; height: 32px; border-radius: 10px; }
.dcat .cat-ic .ico { width: 17px; height: 17px; }
.dcat b { font-family: var(--f-display); font-size: 18px; }
.dcat small { color: var(--muted); font-size: 14px; display: block; line-height: 1.3; }
.dentry { background: var(--card); border: 1px solid var(--line); border-radius: 16px; border-left: 5px solid var(--cc, var(--cobalt)); }
.dentry > button { width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; align-items: center; }
.dentry .dn { font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.dentry .dn small { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
.dentry .ds { color: var(--muted); font-size: 15px; grid-column: 1; }
.dentry .chev { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); transition: transform .2s; }
.dentry > button[aria-expanded="true"] .chev { transform: rotate(90deg); }
.dentry .seen { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); margin-left: 8px; vertical-align: middle; }
.ddetail { padding: 0 14px 16px; display: grid; gap: 12px; animation: rise .25s ease; }
.ddetail .ex { position: relative; font-family: var(--f-display); font-weight: 600; font-size: 18px; background: var(--paper); border-radius: 14px; padding: 12px 14px; border: 1.5px solid var(--line); }
.ddetail .ex-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; font-weight: 500; }
.ddetail dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.ddetail dl > div { background: var(--paper); border-radius: 12px; padding: 10px 12px; }
.ddetail dl > div.wide { grid-column: 1 / -1; }
.ddetail dl > div.warn { background: var(--coral-soft); }
.ddetail dt { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ddetail dd { margin: 0; font-size: 15.5px; }
.ddetail .vs { border-top: 1.5px dashed var(--line); padding-top: 10px; font-size: 15px; }
.dentry.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--sun); } 100% { box-shadow: none; } }

/* =========================================================
   MODAL (rank up)
   ========================================================= */
.modal-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(8, 10, 30, .7); display: grid; place-items: center; padding: 20px; animation: fade .2s ease; }
.modal {
  position: relative; overflow: hidden; width: min(440px, 100%); border-radius: 28px; padding: 34px 26px 26px; text-align: center; color: #fff;
  background: linear-gradient(var(--stage), var(--stage-2)); display: grid; gap: 12px; justify-items: center; max-height: calc(100vh - 40px); overflow-y: auto;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); animation: pop .45s cubic-bezier(.3,1.6,.5,1);
}
.modal .rays {
  position: absolute; left: 50%; top: 110px; width: 700px; height: 700px; margin: -350px 0 0 -350px; z-index: 0;
  background: repeating-conic-gradient(rgba(255, 220, 120, .16) 0 10deg, transparent 10deg 20deg);
  animation: spin 18s linear infinite; border-radius: 50%;
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%);
}
@keyframes spin { to { transform: rotate(360deg); } }
.modal > * { position: relative; z-index: 1; }
.modal .prog-shield { width: 120px; height: 134px; }
.modal .prog-shield b { font-size: 50px; }
.modal h2 { font-size: 34px; color: var(--sun); }
.modal p { color: #D6DAFF; }

/* =========================================================
   TOASTS, CONFETTI, FLOATING XP
   ========================================================= */
.toast-zone { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
.toast {
  background: var(--bar); color: var(--bar-ink); border-radius: 16px; padding: 10px 14px; font-weight: 700; border: 2px solid var(--sun);
  display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); animation: toastin .4s cubic-bezier(.3,1.6,.5,1);
}
@keyframes toastin { from { transform: translateY(20px) scale(.9); opacity: 0; } }
.toast .mini { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #23200F; }
.toast small { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sun); font-weight: 500; }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 80; }
.float-xp {
  position: fixed; z-index: 81; transform: translate(-50%, 0); pointer-events: none;
  font-family: var(--f-display); font-weight: 800; font-size: 28px; color: var(--sun);
  text-shadow: 0 2px 0 var(--sun-deep), 0 4px 12px rgba(0,0,0,.35); animation: floatup 1.3s ease forwards;
}
.float-xp.ok { color: var(--amber); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 900px) {
  .play, .splash, .modes, .prog-grid, .fb-cols { grid-template-columns: minmax(0, 1fr); }
  .play .stage {
    position: relative; top: 0; min-height: 0; padding: 40px 16px 0;
    grid-template-columns: minmax(0, 1fr) 104px; grid-template-rows: auto auto; gap: 10px 8px;
  }
  .play .stage .tagline-row { grid-column: 1 / -1; }
  .play .stage .bubbles { grid-column: 1; grid-row: 2; align-self: center; gap: 12px; padding-bottom: 24px; }
  .play .stage .stage-rick { grid-column: 2; grid-row: 2; }
  .play .stage .stage-rick .rick { max-width: 104px; margin-bottom: 18px; }
  .play.rescue .stage-rick .rick { max-width: 92px; margin-bottom: 46px; }
  .play .stage .bubble { font-size: 18px; padding: 14px 16px; }
  .play .stage .bubble.quote { padding-top: 22px; }
  .play .stage .bubble::after { left: auto; right: -12px; top: 50%; bottom: auto; transform: translateY(-50%); border: 12px solid transparent; border-left-color: #fff; border-right: 0; }
  .play .stage .bubble.thought::after, .play .stage .bubble.thought::before { display: none; }
  .play .stage .bubble.react.good::after { border-left-color: #E4FAEF; border-top-color: transparent; }
  .play .stage .bubble.react.ok::after { border-left-color: #FFF1D6; border-top-color: transparent; }
  .play .stage .bubble.react.bad::after { border-left-color: #FFE6E2; border-top-color: transparent; }
  .play .podium { width: 96px; height: 54px; border-top-width: 5px; left: auto; right: 4px; transform: none; }
  .play .podium::after { width: 24px; height: 24px; font-size: 13px; top: 10px; }
  .play .stage .floor { height: 30px; }
  .play .audience { height: 64px; }
  .play .curtain { width: 9%; }
  .splash .stage { min-height: 0; padding-top: 44px; }
  .splash .stage .stage-rick .rick { max-width: 140px; }
  .theater { min-height: 0; padding-top: 46px; }
  .theater-rick { grid-template-columns: minmax(0, 1fr) auto; }
  .theater-rick .rick { width: 130px; }
  .theater-rick .bubble { margin-bottom: 50px; }
  .hud .rank-meta { min-width: 110px; }
}
@media (max-width: 640px) {
  .barbtn .lbl { display: none; }
  .barbtn { padding: 7px 9px; }
  .brand-name { display: none; }
  .hud { gap: 8px; }
  .topbar { padding: 8px 16px; gap: 10px; }
  #screen { padding: 18px 16px 64px; }
  .panel { padding: 20px 16px; border-radius: 20px; }
  .choice { grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; padding: 11px 12px; }
  .choice .key { width: 36px; height: 36px; font-size: 17px; }
  .choices.grid2 { grid-template-columns: minmax(0,1fr); }
  .pips { margin-left: 0; width: 100%; }
  .marquee { padding: 22px 22px 26px; }
  .mq-top { font-size: 11px; letter-spacing: .35em; }
  .curtain { width: 8%; }
  .theater { padding-left: 18px; padding-right: 18px; }
  .theater-rick { grid-template-columns: minmax(0,1fr); justify-items: center; }
  .theater-rick .bubble { margin-bottom: 0; }
  .theater-rick .bubble::after { right: auto; left: 50%; top: auto; bottom: -13px; transform: translateX(-50%); border: 13px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .ddetail dl { grid-template-columns: minmax(0,1fr); }
  .fb-banner { grid-template-columns: 46px minmax(0,1fr); }
  .fb-banner .fb-ic { width: 46px; height: 46px; }
  .fb-banner .xp-gain { grid-column: 1 / -1; text-align: left; }
  .fb-banner h3 { font-size: 22px; }
  .scoreline b { font-size: 36px; }
  .big-stars .bs { width: 52px; height: 52px; }
  .node .medal { width: 70px; height: 70px; }
  .node-name { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* =========================================================
   COINS, ITEMS, PROP SHOP
   ========================================================= */
.coinchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 7px; border-radius: 99px; border: 0;
  background: linear-gradient(#FFD45E, var(--sun)); color: #3A2A00; font-family: var(--f-display); font-weight: 800; font-size: 16px;
  box-shadow: 0 3px 0 var(--sun-deep); font-variant-numeric: tabular-nums;
}
.coinchip:hover { filter: brightness(1.06); }
.coinchip .ico, .coin-inline .ico, .coinnum .ico, .wallet .ico, .coin-tag .ico { color: #3A2A00; background: #FFE9A6; border-radius: 50%; padding: 2px; }
.coinchip .ico { width: 22px; height: 22px; }
.coin-inline { display: inline-flex; align-items: center; gap: 3px; color: var(--amber); }
.coin-inline .ico { width: 20px; height: 20px; background: var(--sun); }
.coinnum { display: inline-flex; align-items: center; gap: 6px; }
.coinnum .ico { width: 34px; height: 34px; background: var(--sun); }
.float-xp.coin { color: #FFE39A; font-size: 22px; }
.float-xp.coin::before { content: "● "; color: var(--sun); }

.belt { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1.5px dashed var(--line); }
.belt::before { content: "Items"; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.item {
  display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--line); background: var(--card); border-radius: 12px;
  padding: 7px 10px 7px 9px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 var(--line); color: var(--ink);
}
button.item:hover { border-color: var(--violet); }
button.item:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.item .ico { color: var(--violet); }
.item .cnt { min-width: 22px; height: 22px; border-radius: 99px; padding: 0 6px; display: grid; place-items: center; background: var(--violet); color: var(--on-accent); font-family: var(--f-mono); font-size: 12px; }
.item.used, .item.passive.empty { opacity: .5; }
.item.passive { box-shadow: none; border-style: dashed; cursor: help; }
.item.passive .ico { color: var(--mint); }
.item.passive .cnt { background: var(--mint); }
.choice.erased { opacity: .28; filter: grayscale(1); box-shadow: none; transform: none; }
.choice.erased .c-name, .choice.erased .c-line, .choice.erased .c-sub { text-decoration: line-through; text-decoration-thickness: 2px; }
.lab-opt.erased, .lab-card.erased { opacity: .3; text-decoration: line-through; }
.hintbox.clue { background: var(--violet-soft); border-color: var(--violet); }
.hintbox.clue .hi { background: var(--violet); color: var(--on-accent); }
.hintbox.clue b { color: var(--violet); }
.hintbox + .hintbox { margin-top: 10px; }

.wallet { display: flex; align-items: center; gap: 8px; justify-self: start; background: rgba(255,255,255,.08); border: 2px solid var(--sun); border-radius: 99px; padding: 6px 16px 6px 8px; }
.wallet .ico { width: 30px; height: 30px; background: var(--sun); }
.wallet b { font-family: var(--f-display); font-size: 26px; color: var(--sun); font-variant-numeric: tabular-nums; }
.wallet span { color: #C9CEF5; font-size: 14px; }
@media (max-width: 640px) {
  .coinchip { font-size: 14px; padding: 5px 10px 5px 5px; }
  .rank-meta { display: none; }
      }

/* =========================================================
   RICK'S WARDROBE (hats)
   ========================================================= */
.hat { display: none; }
.rick[data-hat="cap"] .hat-cap, .rick[data-hat="beret"] .hat-beret, .rick[data-hat="headphones"] .hat-headphones,
.rick[data-hat="tophat"] .hat-tophat, .rick[data-hat="gradcap"] .hat-gradcap, .rick[data-hat="crown"] .hat-crown { display: inline; }
.hc { fill: #2D44D2; } .hc-dark { fill: #1B2C96; } .hc-line { fill: none; stroke: rgba(255,255,255,.3); stroke-width: 2; }
.hb { fill: #3B2A5C; } .hb-dark { fill: #24183D; }
.hp-band { fill: none; stroke: #2A2D45; stroke-width: 7; stroke-linecap: round; } .hp-cup { fill: #E0463A; } .hp-pad { fill: #2A2D45; }
.ht { fill: #1C1D2E; } .ht-band { fill: #E0463A; } .ht-shine { stroke: rgba(255,255,255,.22); stroke-width: 4; stroke-linecap: round; }
.hg { fill: #1C1D2E; } .hg-top { fill: #2A2C45; stroke: #12131F; stroke-width: 1.5; } .hg-tassel { fill: #FFC233; } .hg-cord { fill: none; stroke: #FFC233; stroke-width: 2; }
.hk { fill: #FFC233; stroke: #C98A00; stroke-width: 1.5; stroke-linejoin: round; } .hk-gem { fill: #E0463A; } .hk-gem2 { fill: #2D44D2; } .hk-tip { fill: #FFE39A; }

/* =========================================================
   CURTAIN-OPENING INTRO + SWEEPING SPOTLIGHTS
   ========================================================= */
.stage.opening .curtain.left { animation: openL 1.4s cubic-bezier(.65,0,.25,1) both; }
.stage.opening .curtain.right { animation: openR 1.4s cubic-bezier(.65,0,.25,1) both; }
@keyframes openL { from { width: 51%; clip-path: polygon(0 0, 100% 0, 100% 34%, 100% 62%, 100% 100%, 0 100%); } }
@keyframes openR { from { width: 51%; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 62%, 0 34%); } }
.stage.opening .curtain::after { animation: fade .3s ease 1.2s both; }
.stage.opening > :not(.valance):not(.curtain):not(.beam):not(.floor):not(.sweep) { animation: riseIn .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: 1s; }
.stage.opening > .marquee { animation-delay: .85s; }
@keyframes riseIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }
.sweep {
  position: absolute; top: -10%; width: 34%; height: 120%; z-index: 0; pointer-events: none; transform-origin: 50% 0;
  background: linear-gradient(rgba(255, 238, 180, .16), rgba(255, 238, 180, 0) 85%);
  clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
}
.sweep.one { left: 6%; animation: sweepA 9s ease-in-out infinite alternate; }
.sweep.two { right: 6%; animation: sweepB 11s ease-in-out infinite alternate; }
@keyframes sweepA { from { transform: rotate(-22deg); } to { transform: rotate(14deg); } }
@keyframes sweepB { from { transform: rotate(22deg); } to { transform: rotate(-12deg); } }
.mq-sub { font-family: var(--f-mono); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: #FFE39A; margin-top: 12px; padding-left: .32em; }
.theater { padding-bottom: 54px; }

/* =========================================================
   LANDING: TICKET, DAILY, HOW-TO, TEASER
   ========================================================= */
.ticket {
  position: relative; z-index: 5; margin: -40px auto 0; width: min(980px, calc(100% - 24px));
  display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(4, minmax(0, 1fr));
  background: var(--card); border-radius: 22px; box-shadow: var(--shadow), 0 0 0 1px var(--line);
}
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.ticket::before { left: -11px; } .ticket::after { right: -11px; }
.tk { padding: 16px 10px; display: grid; justify-items: center; align-content: center; gap: 3px; text-align: center; border-left: 2px dashed var(--line); min-width: 0; }
.tk b { font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tk b small { font-size: 15px; color: var(--muted); font-weight: 700; }
.tk-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tk-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; margin-bottom: 4px; }
.tk-ic .ico { width: 18px; height: 18px; }
.tk-ic.sun { background: var(--sun); color: #3A2A00; } .tk-ic.sun .ico { fill: currentColor; }
.tk-ic.coral { background: var(--coral); }
.tk-ic.gold { background: linear-gradient(#FFD45E, var(--sun)); color: #3A2A00; }
.tk-ic.flame { background: linear-gradient(#FFB347, #FF5B3D); }
.tk-rank { display: flex; justify-content: flex-start; align-items: center; gap: 14px; text-align: left; border-left: 0; padding: 16px 20px 16px 26px; }
.tk-rank-txt { display: grid; gap: 3px; min-width: 0; flex: 1; }
.tk-rank-txt b { font-size: 22px; }
.tk-rank-txt small { color: var(--muted); font-size: 13px; }
.tk-bar { height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.tk-bar span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sun), #FFE39A); }
.rank-shield.big { width: 54px; height: 60px; font-size: 22px; }
.rank-shield.big svg path { fill: var(--sun); stroke: var(--sun-deep); }

.home-duo { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; margin-top: 26px; }
.home-duo.lower { margin-top: 18px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: stretch; }
.home-duo > * { min-width: 0; }

.daily {
  position: relative; overflow: hidden; isolation: isolate; border-radius: 24px; padding: 22px; color: #fff; display: grid; gap: 16px; align-content: start;
  background: linear-gradient(135deg, #2A174A, #4A1D4F 55%, #7A2A3A); box-shadow: var(--shadow);
}
.daily::after { content: ""; position: absolute; right: -80px; top: -80px; width: 240px; height: 240px; border-radius: 50%; z-index: -1; background: radial-gradient(circle, rgba(255, 170, 80, .35), transparent 70%); }
.daily .eyebrow { color: #FFD6E0; }
.daily h3 { font-size: 26px; margin: 2px 0 4px; }
.daily p { color: #EADCF5; font-size: 16px; }
.daily-head { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 16px; align-items: center; }
.daily-flame {
  position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; color: #8B8FB8;
  background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.18);
}
.daily-flame .ico { width: 42px; height: 42px; }
.daily-flame b {
  position: absolute; right: -6px; bottom: -6px; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center;
  background: var(--sun); color: #23200F; font-family: var(--f-display); font-weight: 800; font-size: 16px; border: 3px solid #2A174A;
}
.daily-flame.lit { background: radial-gradient(circle at 50% 62%, #FFC56B, #FF6B3D 60%, #C8361F); border-color: #FFD27A; color: #FFF3C4; box-shadow: 0 0 34px rgba(255, 140, 60, .55); }
.daily-flame.lit .ico { animation: flicker .9s ease-in-out infinite alternate; fill: rgba(255,255,255,.25); }
.week { display: flex; gap: 6px; }
.wk { flex: 1; display: grid; justify-items: center; gap: 5px; font-family: var(--f-mono); font-size: 11px; color: #CDBDE8; min-width: 0; }
.wk i { width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-style: normal;
  background: rgba(255,255,255,.07); border: 2px dashed rgba(255,255,255,.22); }
.wk i .ico { width: 18px; height: 18px; stroke-width: 3; }
.wk.played i { background: var(--sun); border: 2px solid var(--sun-deep); color: #23200F; animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; }
.wk.today i { border-style: solid; border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.wk.today { color: #fff; font-weight: 500; }
.wk.future { opacity: .45; }
.daily .btn { justify-self: start; }
.daily .btn .coin-inline { color: #6B4A00; font-size: 15px; }
.daily-done { display: flex; gap: 8px; align-items: center; font-weight: 700; color: #FFE39A; }
.daily-done .ico { width: 22px; height: 22px; stroke-width: 3; }
.daily-big { display: flex; gap: 20px; align-items: center; }
.daily-big .daily-flame { flex: none; width: 96px; height: 96px; }
.daily-big .daily-flame b { border-color: var(--paper); }

.howto-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px; box-shadow: var(--shadow); }
.howto-card h3 { font-size: 24px; margin: 2px 0 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; align-items: center; counter-increment: step; }
.st-ic { position: relative; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--sc); color: var(--on-accent); transform: rotate(-4deg); box-shadow: 0 3px 0 rgba(0,0,0,.22); }
.st-ic .ico { width: 24px; height: 24px; }
.st-ic::after { content: counter(step); position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 800; font-size: 11px; transform: rotate(4deg); }
.steps b { display: block; font-family: var(--f-display); font-size: 17px; }
.steps li > div > span { color: var(--muted); font-size: 15px; }

.node.perfect .medal { border-color: var(--sun); box-shadow: 0 5px 0 var(--sun-deep), 0 0 0 5px var(--sun-soft), 0 0 26px rgba(255, 194, 51, .55); }
.node.perfect .medal .ico { color: var(--sun-deep); }

.shop-teaser { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); border-radius: 24px; overflow: hidden; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.teaser-stage {
  position: relative; overflow: hidden; min-height: 200px; display: flex; align-items: flex-end; justify-content: center;
  background: radial-gradient(70% 70% at 50% 10%, rgba(66, 83, 214, .8), transparent 70%), linear-gradient(var(--stage), var(--stage-2));
}
.teaser-stage .floor { height: 40px; }
.teaser-ricks { position: relative; z-index: 2; display: flex; align-items: flex-end; margin-bottom: 14px; }
.teaser-ricks .rick { width: 96px; margin: 0 -10px; }
.teaser-ricks .rick:nth-child(2) { width: 110px; z-index: 1; }
.teaser-copy { padding: 22px; display: grid; gap: 8px; align-content: center; }
.teaser-copy h3 { font-size: 24px; }
.teaser-copy p { color: var(--muted); }
.teaser-copy .btn { justify-self: start; margin-top: 4px; }
.teaser-copy .btn .coin-inline { color: #6B4A00; }
.home-duo .rematch { margin-top: 0; flex-direction: column; align-items: flex-start; justify-content: center; }
.rematch.calm { border: 1px solid var(--line); box-shadow: var(--shadow); }
.rematch.calm .mode-icon { --mc: var(--cobalt); --mc-deep: var(--cobalt-deep); }
.rematch h3 { font-size: 22px; }

/* =========================================================
   PROP SHOP (tabbed sheet)
   ========================================================= */
.modal.shop {
  width: min(840px, 100%); padding: 0; gap: 0; text-align: left; justify-items: stretch;
  display: flex; flex-direction: column; overflow: hidden; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
}
.shop-top { position: relative; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: center; padding: 20px 64px 16px 22px; background: linear-gradient(#262C6A, var(--stage)); flex: none; }
.shop-stage {
  position: relative; height: 196px; border-radius: 18px; overflow: hidden; display: flex; justify-content: center; align-items: flex-end;
  background: radial-gradient(70% 70% at 50% 10%, rgba(66, 83, 214, .8), transparent 70%), linear-gradient(var(--stage), var(--stage-2));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.shop-stage .curtain { width: 17%; }
.shop-stage .floor { height: 34px; }
.shop-rick { position: relative; z-index: 3; width: 124px; margin-bottom: 6px; }
.shop-rick .rick { width: 100%; max-width: none; }
.shop-caption { position: absolute; z-index: 4; left: 50%; top: 36px; transform: translateX(-50%); white-space: nowrap;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #FFE39A; background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 99px; }
.shop-intro { display: grid; gap: 6px; justify-items: start; }
.shop-intro .eyebrow { color: var(--sun); }
.shop-intro h2 { font-size: 34px; color: var(--sun); }
.shop-intro p { color: #C9CEF5; font-size: 15px; max-width: 46ch; }
.shop-x { position: absolute; top: 14px; right: 14px; color: #fff; }
.shop-tabs { display: flex; gap: 4px; padding: 0 18px; background: var(--stage); border-bottom: 1px solid rgba(255,255,255,.1); flex: none; overflow-x: auto; }
.shop-tab { display: inline-flex; gap: 8px; align-items: center; border: 0; background: transparent; color: #A9AFDA; font-weight: 700; font-size: 16px; padding: 13px 14px 11px; border-bottom: 3px solid transparent; white-space: nowrap; }
.shop-tab:hover { color: #fff; }
.shop-tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--sun); }
.shop-tab[aria-selected="true"] .ico { color: var(--sun); }
.shop-grid {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 20px 22px; background: var(--stage-2);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start;
}
.shop-sub { grid-column: 1 / -1; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #A9AFDA; margin-top: 6px; }
.shop-sub:first-child { margin-top: 0; }
.tile {
  position: relative; display: grid; justify-items: center; align-content: start; text-align: center; gap: 7px; padding: 12px 12px 14px;
  border-radius: 18px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.1); color: #fff; font: inherit;
  transition: transform .12s, border-color .12s, background .12s;
}
button.tile:hover { border-color: var(--sun); transform: translateY(-3px); background: rgba(255,255,255,.09); }
.tile b { font-size: 15px; line-height: 1.2; }
.tile small { color: #B9BFE6; font-size: 13px; line-height: 1.35; }
.tile .btn { margin-top: 2px; }
.tile .btn .ico { width: 17px; height: 17px; background: #FFE9A6; border-radius: 50%; padding: 1px; color: #3A2A00; }
