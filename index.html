  /* =========================================================
     QUESTION
     ========================================================= */
  function nextQuestion() {
    if (run.kind === "free" && run.i >= run.queue.length) run.queue = run.queue.concat(shuffle(run.pool));
    if (run.i >= run.queue.length) return run.kind === "campaign" ? renderEpisodeEnd() : renderSessionEnd();
    const item = run.queue[run.i];
    const q = item.q, mode = item.mode;
    let order = null;
    if (mode === "detective") order = shuffle(q.choices);
    else if (mode === "rescue" || mode === "fixit") order = shuffle(q.options.map((_, idx) => idx));
    cur = {
      q, mode, order, bonus: !!item.bonus, picked: null, locked: false, hint: false, clue: false,
      erased: new Set(), labPicks: q.audiences ? q.audiences.map(() => null) : null, labLocked: new Set(), decoyGone: false,
      finishType: null, start: Date.now()
    };
    if (cur.bonus) sfx("fanfare");
    renderQuestion();
  }

  function roundLabel() {
    if (run.kind === "campaign") return cur.bonus ? `Episode ${run.ep + 1} · Bonus round` : `Episode ${run.ep + 1} · Round ${run.i + 1} of ${PER_EP}`;
    if (run.kind === "rematch") return `Rematch · ${run.i + 1} of ${run.queue.length}`;
    if (run.kind === "daily") return `Daily Challenge · ${new Date().toLocaleDateString(undefined, { month: "long", day: "numeric" })}`;
    if (run.practice) return `Practice: ${DICT[run.practice].name} · Round ${run.i + 1}`;
    return `Free Play · Round ${run.i + 1}`;
  }

  function pipsHTML() {
    if (run.kind === "free" || run.kind === "daily") return "";
    if (run.kind === "rematch" && run.queue.length > 12) return "";
    const total = run.kind === "campaign" ? PER_EP : run.queue.length;
    let h = "";
    for (let i = 0; i < total; i++) {
      const r = run.results[i];
      h += `<span class="pip ${r ? "done-" + r : i === run.i ? "now" : ""}"></span>`;
    }
    if (run.kind === "campaign" && run.queue.length > PER_EP) {
      const br = run.bonusRating;
      h += `<span class="pip bonus ${br ? "done-" + br : cur.bonus ? "now" : ""}"></span>`;
    }
    return `<div class="pips" aria-hidden="true">${h}</div>`;
  }

  function stageHTML() {
    const { q, mode } = cur;
    const deco = `<div class="valance"></div><div class="curtain left"></div><div class="curtain right"></div><div class="beam"></div><div class="floor"></div>`;
    const front = mode === "rescue" || mode === "lab" ? audienceHTML(9) : `<div class="podium"></div>`;
    let label, bubble, mood;
    if (mode === "detective") {
      label = "Rick says…"; mood = "talk";
      bubble = `<div class="bubble quote" id="bubble"><span class="qmark">${icon("quote")}</span><span id="qtext">${calmMotion() ? esc(q.quote) : ""}</span></div>`;
    } else if (mode === "rescue") {
      label = "Rick is stumped"; mood = "stumped";
      bubble = `<div class="bubble thought" id="bubble">${esc(pick(RR_RICK.stumped))}</div>`;
    } else if (mode === "fixit") {
      label = "Rick needs an edit"; mood = "oops";
      bubble = `<div class="bubble thought" id="bubble">${esc(pick(["I wrote this line last night. Now I'm worried it's… not great.", "Something about this draft feels off. Can you fix it without losing my point?", "Be honest. Is this line going to get me in trouble?"]))}</div>`;
    } else {
      label = "Three crowds, one idea"; mood = "wow";
      bubble = `<div class="bubble thought" id="bubble">${esc(pick(["Same idea, three different crowds. Which tool works for which one?", "I can't give the same speech to everyone… can I?", "Help me read the room. All three rooms."]))}</div>`;
    }
    return `${deco}
      <div class="tagline-row"><span class="eyebrow">${label}</span>${cur.bonus ? `<span class="modetag bonus">${icon("star")}Bonus</span>` : ""}</div>
      <div class="bubbles">${bubble}</div>
      <div class="stage-rick">${rickHTML(mood, "idle")}</div>
      ${front}`;
  }

  function bodyHTML() {
    const { q, mode } = cur;
    if (mode === "detective") return `
      <p class="setting"><b>The situation:</b> ${esc(q.setting)}</p>
      <p class="ask">${icon("search")}${esc(q.ask || "Which device is Rick using?")}</p>`;
    if (mode === "rescue") return `
      <div class="scan" aria-label="Audience scan">
        <div class="scan-row"><span class="scan-letter">${icon("megaphone")}</span><div class="scan-val"><div class="scan-label">Rick's claim</div>${esc(q.claim)}</div></div>
        <div class="scan-row aud"><span class="scan-letter">${icon("users")}</span><div class="scan-val"><div class="scan-label">Audience</div><b>${esc(q.audience)}</b></div></div>
        <div class="scan-row"><span class="scan-letter">${icon("eye")}</span><div class="scan-val"><div class="scan-label">Audience scan: what they care and worry about</div><ul>${q.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div></div>
        <div class="scan-row"><span class="scan-letter">${icon("target")}</span><div class="scan-val"><div class="scan-label">Goal</div>${esc(q.goal)}</div></div>
      </div>
      <p class="ask">${icon("bulb")}Which strategy should Rick lead with?</p>`;
    if (mode === "fixit") return `
      <p class="setting"><b>The situation:</b> ${esc(q.setting)}</p>
      <div class="goal-line">${icon("target")}<span><b>Rick's goal:</b> ${esc(q.goal)}</span></div>
      <div class="draft"><span class="stamp">Needs a fix</span><div class="draft-label">Rick's draft</div><div class="draft-text">“${esc(q.draft)}”</div></div>
      <p class="ask">${icon("wrench")}Pick the rewrite that keeps Rick's goal and drops the problem.</p>`;
    return `
      <p class="setting"><b>Rick's claim:</b> ${esc(q.claim)}</p>
      <div class="eyebrow">Device cards (one is a decoy)</div>
      <div class="lab-pool">${q.pool.map(id => `<span class="lab-card" data-pool="${id}">${icon(CAT_STYLE[DICT[id].cat].icon)}${esc(DICT[id].name)}</span>`).join("")}</div>
      <p class="ask">${icon("flask")}Match each audience with its best device.</p>`;
  }

  function choicesHTML() {
    const { q, mode, order } = cur;
    if (mode === "lab") {
      return `<div class="lab-rows">${q.audiences.map((a, ri) => `
        <div class="lab-row" data-row="${ri}">
          <div class="lab-who"><span class="av">${icon("users")}</span><div><b>${esc(a.who)}</b><small>${esc(a.cares)}</small></div></div>
          <div class="lab-opts" role="group" aria-label="Device for ${esc(a.who)}">
            ${q.pool.map(id => `<button type="button" class="lab-opt" data-row="${ri}" data-dev="${id}" aria-pressed="false">${esc(DICT[id].name)}</button>`).join("")}
          </div>
          <div class="lab-res" hidden></div>
        </div>`).join("")}</div>`;
    }
    return `<div class="choices" id="choices" role="group" aria-label="Answer choices">${order.map((key, idx) => {
      let inner;
      if (mode === "detective") {
        const d = DICT[key];
        inner = `<span class="c-name">${esc(d.name)}<span class="chip-slot"></span></span>${q.level === 1 ? `<span class="c-sub">${esc(d.short)}</span>` : ""}`;
      } else if (mode === "rescue") {
        const o = q.options[key];
        inner = `<span class="c-name">${esc(DICT[o.d].name)}<span class="chip-slot"></span></span><span class="c-line">“${esc(o.line)}”</span>`;
      } else {
        const o = q.options[key];
        inner = `<span class="c-name"><span class="chip-slot"></span></span><span class="c-line">“${esc(o.text)}”</span>`;
      }
      return `<button type="button" class="choice" data-idx="${idx}" aria-pressed="false">
        <span class="key">${LETTERS[idx]}</span><span>${inner}</span><span class="c-mark"></span></button>`;
    }).join("")}</div>`;
  }

  function beltHTML() {
    return ITEMS.filter(it => it.id !== "shield").map(it => `
      <button class="item" type="button" data-item="${it.id}" title="${esc(it.desc)}">
        ${icon(it.icon)}<span>${esc(it.name)}</span><span class="cnt">${S.inv[it.id]}</span>
      </button>`).join("") +
      `<span class="item passive ${S.inv.shield ? "" : "empty"}" title="${esc(ITEMS[2].desc)}">${icon("shield")}<span class="cnt">${S.inv.shield}</span></span>`;
  }
  function refreshBelt() {
    const b = $("#belt");
    if (!b || !cur || cur.locked) return;
    b.innerHTML = beltHTML();
    b.querySelectorAll("[data-item]").forEach(x => (x.onclick = () => useItem(x.dataset.item)));
    markUsedItems();
  }
  function markUsedItems() {
    const b = $("#belt"); if (!b) return;
    const clueBtn = b.querySelector('[data-item="clue"]');
    if (clueBtn && cur.clue && cur.mode !== "lab") clueBtn.classList.add("used");
  }

  function renderQuestion() {
    const { q, mode } = cur;
    screen.innerHTML = `
      <section class="play ${mode}">
        <div class="stage" id="stage">${stageHTML()}</div>
        <div class="panel qpanel ${mode}">
          <div class="roundbar">
            ${run.kind === "daily" ? `<span class="modetag bonus">${icon("zap")}Daily</span>` : ""}
            <span class="modetag ${mode}">${icon(MODE_ICON[mode])}${RR_MODES[mode].name}</span>
            <span class="lvl">${LEVEL_NAME[q.level]}</span>
            <span class="combo ${S.streak >= 2 ? "" : "cold"}" id="combo" title="Strong answers in a row">${icon("flame")}<b>${S.streak}</b><span>in a row</span></span>
            ${pipsHTML()}
          </div>
          <div class="eyebrow">${roundLabel()}</div>
          <h2 class="q-title">${esc(q.title)}</h2>
          ${bodyHTML()}
          ${choicesHTML()}
          <div id="hint-slot"></div>
          <div class="actions" id="actions">
            <button class="btn" type="button" id="submit" disabled>${icon("check")}Lock it in</button>
            <button class="btn ghost small" type="button" id="hint">${icon("bulb")}Free hint</button>
            <span class="spacer"></span>
            <button class="linkbtn" type="button" id="quit">${run.kind === "campaign" ? "Leave episode" : run.kind === "daily" ? "Back to map" : "End session"}</button>
          </div>
          <div class="belt" id="belt" aria-label="Your items"></div>
          <div id="fb-slot"></div>
        </div>
      </section>`;

    if (mode === "lab") screen.querySelectorAll(".lab-opt").forEach(b => (b.onclick = () => labSelect(+b.dataset.row, b.dataset.dev)));
    else screen.querySelectorAll(".choice").forEach(b => (b.onclick = () => select(+b.dataset.idx)));
    $("#submit").onclick = submit;
    $("#hint").onclick = showHint;
    $("#quit").onclick = confirmLeave;
    refreshBelt();
    if (mode === "detective" && !calmMotion()) {
      cur.finishType = typeInto($("#qtext"), q.quote, screen.querySelector("#stage .rick"));
    }
    focusScreen();
  }

  function confirmLeave() {
    if (run.kind === "daily") return renderHome();
    if (run.kind !== "campaign") return renderSessionEnd();
    if (run.i === 0 && !cur.locked) return renderHome();
    if ($("#leavebox")) return;
    $("#actions").insertAdjacentHTML("afterend", `<div class="leavebox" id="leavebox" role="alert">
      <b>Leave this episode?</b> You keep the XP and coins you've earned, but the episode starts over next time.
      <div class="cta-row"><button class="btn coral small" type="button" id="leave-yes">Leave</button><button class="btn ghost small" type="button" id="leave-no">Keep playing</button></div></div>`);
    $("#leave-yes").onclick = renderHome;
    $("#leave-no").onclick = () => $("#leavebox").remove();
    $("#leave-no").focus();
  }

  function select(idx) {
    if (cur.locked || cur.erased.has(idx)) return;
    if (cur.finishType) cur.finishType();
    cur.picked = idx;
    sfx("select");
    screen.querySelectorAll(".choice").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.idx === idx)));
    $("#submit").disabled = false;
  }

  function labSelect(row, dev) {
    if (cur.locked || cur.labLocked.has(row)) return;
    cur.labPicks[row] = dev;
    sfx("select");
    screen.querySelectorAll(`.lab-opt[data-row="${row}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dev === dev)));
    screen.querySelector(`.lab-row[data-row="${row}"]`).classList.add("filled");
    $("#submit").disabled = cur.labPicks.some(p => !p);
  }

  function showHint() {
    if (cur.locked || cur.hint) return;
    cur.hint = true; run.hints++;
    sfx("click");
    const text = cur.q.hint || (cur.mode === "lab" ? "For each audience, look at what they care about. A decision-maker needs facts; a crowd that needs to care needs a story or picture; a worried group needs its concern acknowledged." : "Ask two questions about each rewrite: Does it keep Rick's goal? Does it drop the problem?");
    $("#hint-slot").insertAdjacentHTML("beforeend", `<div class="hintbox"><span class="hi">${icon("bulb")}</span><div><b>Rick's hint</b>${esc(text)}</div></div>`);
    $("#hint").disabled = true;
  }

  /* ---------------- Items ---------------- */
  function useItem(id) {
    if (!cur || cur.locked) return;
    if (S.inv[id] <= 0) { openShop(); return; }
    const ok = id === "eraser" ? useEraser() : useClue();
    if (!ok) return;
    S.inv[id]--;
    save(); refreshBelt();
  }

  function useEraser() {
    const { q, mode } = cur;
    if (mode === "lab") {
      if (cur.decoyGone) { toast("The decoy card is already gone.", "eraser"); return false; }
      const used = new Set(q.audiences.flatMap(a => [a.best, ...(a.ok || [])]));
      const decoy = q.pool.find(id => !used.has(id));
      if (!decoy) { toast("Every card in this lab is useful somewhere.", "eraser"); return false; }
      cur.decoyGone = true;
      screen.querySelectorAll(`.lab-opt[data-dev="${decoy}"]`).forEach(b => { b.classList.add("erased"); b.disabled = true; });
      screen.querySelector(`.lab-card[data-pool="${decoy}"]`)?.classList.add("erased");
      cur.labPicks = cur.labPicks.map(p => (p === decoy ? null : p));
      screen.querySelectorAll(".lab-row").forEach((r, i) => { if (!cur.labPicks[i]) r.classList.remove("filled"); });
      $("#submit").disabled = cur.labPicks.some(p => !p);
      sfx("erase");
      toast(`Erased the decoy: ${esc(DICT[decoy].name)}.`, "eraser", "Eraser");
      return true;
    }
    const visible = cur.order.map((_, i) => i).filter(i => !cur.erased.has(i));
    const wrong = visible.filter(i => mode === "detective" ? cur.order[i] !== q.answer : q.options[cur.order[i]].rating === "weak");
    if (visible.length <= 2 || !wrong.length) { toast("Nothing left to erase. The remaining choices are both worth a look.", "eraser"); return false; }
    const idx = pick(wrong);
    cur.erased.add(idx);
    const btn = screen.querySelector(`.choice[data-idx="${idx}"]`);
    btn.classList.add("erased"); btn.disabled = true; btn.setAttribute("aria-pressed", "false");
    if (cur.picked === idx) { cur.picked = null; $("#submit").disabled = true; }
    sfx("erase");
    return true;
  }

  function useClue() {
    const { q, mode } = cur;
    if (cur.clue && mode !== "lab") { toast("You already used a Clue Card on this question.", "sparkles"); return false; }
    let text;
    if (mode === "detective" || mode === "rescue") {
      const id = mode === "detective" ? q.answer : q.options.find(o => o.rating === "best").d;
      const c = CAT[DICT[id].cat];
      text = `The ${mode === "detective" ? "answer" : "best strategy"} comes from the <b>${esc(c.name)}</b> family: ${esc(c.blurb)}`;
    } else if (mode === "fixit") {
      text = `The problem in Rick's draft is <b>${esc(DICT[q.flaw].name)}</b>: ${esc(DICT[q.flaw].short)}`;
    } else {
      const row = q.audiences.findIndex((a, i) => !cur.labLocked.has(i) && cur.labPicks[i] !== a.best);
      if (row < 0) { toast("Every audience already has its best match. Lock it in!", "sparkles"); return false; }
      const a = q.audiences[row];
      labSelect(row, a.best);
      cur.labLocked.add(row);
      screen.querySelectorAll(`.lab-opt[data-row="${row}"]`).forEach(b => (b.disabled = true));
      text = `Filled in: <b>${esc(a.who)}</b> → <b>${esc(DICT[a.best].name)}</b>.`;
    }
    cur.clue = true;
    sfx("coin");
    $("#hint-slot").insertAdjacentHTML("beforeend", `<div class="hintbox clue"><span class="hi">${icon("sparkles")}</span><div><b>Clue Card</b>${text}</div></div>`);
    return true;
  }

  /* =========================================================
     SUBMIT & SCORE
     ========================================================= */
  function submit() {
    if (!cur || cur.locked) return;
    const { q, mode, order, picked } = cur;
    if (mode === "lab" ? cur.labPicks.some(p => !p) : picked == null) return;
    if (cur.finishType) cur.finishType();
    cur.locked = true;

    let rating, base;
    if (mode === "lab") {
      cur.labRatings = q.audiences.map((a, i) => cur.labPicks[i] === a.best ? "best" : (a.ok || []).includes(cur.labPicks[i]) ? "ok" : "weak");
      base = cur.labRatings.reduce((s, r) => s + (POINTS.lab[r] || 0), 0);
      const sc = cur.labRatings.reduce((s, r) => s + (r === "best" ? 1 : r === "ok" ? 0.5 : 0), 0);
      rating = sc === q.audiences.length ? "best" : sc >= 1.5 ? "ok" : "weak";
    } else {
      rating = mode === "detective" ? (order[picked] === q.answer ? "best" : "weak") : q.options[order[picked]].rating;
      base = POINTS[mode][rating] || 0;
    }

    // streak (with Streak Shield)
    let shieldUsed = false;
    if (rating === "best") { S.streak++; S.strong++; }
    else if (rating === "weak") {
      if (S.streak > 0 && S.inv.shield > 0) { S.inv.shield--; shieldUsed = true; }
      else S.streak = 0;
    }
    const bonus = rating === "best" && S.streak >= 3 ? Math.min(S.streak - 1, 5) : 0;
    let coins = earnsCoins() ? base : 0;
    if (run.kind === "daily") {
      const y = new Date(); y.setDate(y.getDate() - 1);
      S.daily.streak = S.daily.last === dayKey(y) ? S.daily.streak + 1 : 1;
      S.daily.last = dayKey();
      S.daily.best = Math.max(S.daily.best, S.daily.streak);
      S.daily.days = (S.daily.days || []).concat(dayKey()).slice(-60);
      coins = (rating === "best" ? 20 : rating === "ok" ? 10 : 5) + Math.min(5 * (S.daily.streak - 1), 25);
      if (S.daily.streak >= 3) award("daily3");
    }
    const prev = rankFor(S.xp);
    S.xp += base + bonus;
    S.coins += coins; S.coinsEarned += coins; run.coins += coins;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    S.answered++;

    // mastery
    const mKey = mode === "detective" ? DICT[q.answer].cat : mode === "rescue" ? "rescue" + q.level : mode;
    const m = S.mastery[mKey] || (S.mastery[mKey] = { right: 0, total: 0 });
    m.total++; m.right += rating === "best" ? 1 : rating === "ok" ? 0.5 : 0;

    // history
    const h = S.history[q.id] || (S.history[q.id] = { last: null });
    const wasMissed = h.last === "weak";
    h.last = rating;

    // badges
    if (rating === "best") award("first_catch");
    if (S.streak >= 5) award("streak5");
    if (S.streak >= 10) award("streak10");
    if (mode === "detective" && rating === "best" && DICT[q.answer].cat === "redflags") { S.flags++; if (S.flags >= 5) award("red_flag"); }
    if (mode === "rescue") { run.rescueRun = rating === "best" ? (run.rescueRun || 0) + 1 : 0; if (run.rescueRun >= 3) award("room_reader"); }
    if (mode === "fixit" && rating === "best") { S.fixWins++; if (S.fixWins >= 3) award("fixer"); }
    if (mode === "lab" && rating === "best") award("whisperer");
    if (wasMissed && rating === "best") award("comeback");

    if (cur.bonus) run.bonusRating = rating; else run.results[run.i] = rating;
    S.timeMs = (S.timeMs || 0) + Math.min(Date.now() - (cur.start || Date.now()), 180000);
    S.log = (S.log || []).concat({ t: Date.now(), id: q.id, m: mode, r: rating }).slice(-200);
    save();
    updateHUD();

    // juice
    const sub = $("#submit");
    const combo = $("#combo");
    if (combo) { combo.querySelector("b").textContent = S.streak; combo.classList.toggle("cold", S.streak < 2); combo.classList.remove("pump"); void combo.offsetWidth; if (rating === "best") combo.classList.add("pump"); }
    const MILESTONES = { 3: "3 in a row!", 5: "On fire!", 10: "Unstoppable!", 15: "Legendary!", 20: "20 streak!", 30: "30 streak!" };
    if (rating === "best" && MILESTONES[S.streak]) setTimeout(() => { burst($("#stage"), MILESTONES[S.streak]); sfx("combo"); }, 350);
    if (rating === "best") { sfx("right"); confettiFrom(sub, 50, 1); }
    else if (rating === "ok") sfx("ok");
    else sfx("wrong");
    if (base + bonus > 0) floatText(sub, `+${base + bonus} XP`, rating === "ok" ? "ok" : "");
    if (coins) setTimeout(() => floatText($("#coinchip"), `+${coins}`, "coin"), 250);
    if (shieldUsed) setTimeout(() => toast(`Your Streak Shield saved a streak of ${S.streak}!`, "shield", "Streak Shield"), 400);

    renderReveal(rating, base, bonus, coins);
    const now = rankFor(S.xp);
    if (now.idx > prev.idx) setTimeout(() => showRankUp(now.r, now.idx), 900);
  }

  /* =========================================================
     FEEDBACK
     ========================================================= */
  function banner(rating, title, sub, base, bonus, coins) {
    const ic = rating === "best" ? "check" : rating === "ok" ? "tilde" : "x";
    const cls = rating === "best" ? "" : rating === "ok" ? "ok" : "bad";
    return `<div class="fb-banner ${cls}">
      <span class="fb-ic">${icon(ic)}</span>
      <div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ""}</div>
      ${base + bonus > 0
        ? `<div class="xp-gain">+${base + bonus} XP${coins ? ` <span class="coin-inline">${icon("coin")}+${coins}</span>` : ""}<small>${bonus ? `includes streak bonus +${bonus}` : !earnsCoins() ? "practice round: no coins" : "&nbsp;"}</small></div>`
        : `<div class="xp-gain"><small>Saved to your<br>Rematch pile</small></div>`}
    </div>`;
  }
  const card = (cls, ic, head, body) => `<div class="fb-card ${cls}"><h4>${icon(ic)}${head}</h4>${body}</div>`;

  function renderReveal(rating, base, bonus, coins) {
    const { q, mode, order, picked } = cur;

    // mark the answer controls
    if (mode === "lab") {
      screen.querySelectorAll(".lab-row").forEach((row, i) => {
        const a = q.audiences[i], r = cur.labRatings[i];
        row.classList.remove("filled"); row.classList.add("r-" + r);
        row.querySelectorAll(".lab-opt").forEach(b => { b.disabled = true; if (b.dataset.dev === a.best) b.classList.add("correct"); });
        const res = row.querySelector(".lab-res");
        res.hidden = false;
        res.innerHTML = `<span><span class="verdict-chip ${r}">${r === "best" ? "Best fit" : r === "ok" ? "Defensible" : "Not the best fit"}</span> ${r !== "best" ? `Best fit: <b>${esc(DICT[a.best].name)}</b>` : `<b>${esc(DICT[a.best].name)}</b>`}</span>
          <span class="line">“${esc(a.line)}”</span><span>${esc(a.why)}</span>`;
      });
    } else {
      screen.querySelectorAll(".choice").forEach(b => {
        const idx = +b.dataset.idx;
        b.disabled = true;
        const slot = b.querySelector(".chip-slot"), mark = b.querySelector(".c-mark");
        if (mode === "detective") {
          if (order[idx] === q.answer) { b.classList.add("is-best"); mark.innerHTML = icon("check"); slot.innerHTML = `<span class="verdict-chip best">Answer</span>`; }
          else if (idx === picked) { b.classList.add("is-wrong"); mark.innerHTML = icon("x"); slot.innerHTML = `<span class="verdict-chip weak">Your pick</span>`; }
          else b.classList.add("dim");
        } else {
          const o = q.options[order[idx]];
          slot.innerHTML = `<span class="verdict-chip ${o.rating}">${o.rating === "best" ? "Best" : o.rating === "ok" ? "Defensible" : "Weak"}</span>`;
          if (o.rating === "best") { b.classList.add("is-best"); mark.innerHTML = icon("check"); }
          else if (idx === picked) { b.classList.add(o.rating === "ok" ? "is-ok" : "is-wrong"); mark.innerHTML = icon(o.rating === "ok" ? "tilde" : "x"); }
          else b.classList.add("dim");
        }
      });
    }
    screen.classList.remove("enter");
    $("#submit").remove(); $("#hint").remove(); $("#belt").remove();
    const pipNow = screen.querySelector(".pip.now");
    if (pipNow) pipNow.className = "pip " + (cur.bonus ? "bonus " : "") + "done-" + rating;

    // Rick reacts
    const rick = screen.querySelector("#stage .rick");
    rick.dataset.mood = rating === "best" ? "happy" : rating === "ok" ? "wow" : "oops";
    rick.classList.remove("bounce", "shake", "idle"); void rick.offsetWidth;
    rick.classList.add(rating === "weak" ? "shake" : "bounce");
    const lbl = screen.querySelector("#stage .tagline-row .eyebrow");
    if (lbl) lbl.textContent = rating === "best" ? "Rick is thrilled" : rating === "ok" ? "Rick is thinking it over" : "Rick is regrouping";
    const line = pick(rating === "best" ? RR_RICK.right : rating === "ok" ? RR_RICK.ok : RR_RICK.wrong);
    const react = document.createElement("div");
    react.className = `bubble react ${rating === "best" ? "good" : rating === "ok" ? "ok" : "bad"}`;
    react.textContent = line;
    const bubbles = screen.querySelector("#stage .bubbles");
    if (mode === "detective") bubbles.appendChild(react); else bubbles.replaceChildren(react);

    // audience reaction
    const aud = screen.querySelector("#stage .audience");
    let pct = 0;
    if (aud) {
      if (mode === "lab") pct = Math.round((cur.labRatings.reduce((s, r) => s + (r === "best" ? 1 : r === "ok" ? 0.5 : 0), 0) / q.audiences.length) * 100);
      else pct = rating === "best" ? 86 + Math.floor(Math.random() * 12) : rating === "ok" ? 52 + Math.floor(Math.random() * 12) : 8 + Math.floor(Math.random() * 14);
      const figs = [...aud.querySelectorAll(".aud")];
      const won = Math.round((pct / 100) * figs.length);
      shuffle(figs).forEach((f, i) => { if (i < won) f.classList.add("won"); if (rating === "ok") f.classList.add("okc"); });
      aud.classList.add("reacted");
    }

    const isLast = run.kind !== "free" && run.i === run.queue.length - 1;
    const nextLabel = isLast ? (run.kind === "campaign" ? "Finish episode" : "See results")
      : run.kind === "campaign" && run.queue[run.i + 1]?.bonus ? "Bonus round" : "Next round";
    let html = "", lookId;

    if (mode === "detective") {
      const ans = DICT[q.answer], pickedId = order[picked];
      lookId = q.answer;
      html = banner(rating, rating === "best" ? "You spotted it!" : "Not quite.", rating === "best" ? `Rick was using <b>${esc(ans.name)}</b>.` : `The answer was <b>${esc(ans.name)}</b>.`, base, bonus, coins)
        + (rating !== "best" ? card("mistake", "x", `You picked ${esc(DICT[pickedId].name)}`, `<p>${esc(q.others[pickedId] || DICT[pickedId].short)}</p>`) : "")
        + card("answer", "check", "How the words prove it", `<p class="big">${esc(ans.name)}</p><p>${esc(q.why)}</p>`)
        + `<div class="fb-cols">`
        + card("", "users", "Effect on the audience", `<p>${esc(q.effect)}</p>`)
        + card("", "search", "Why not the others?", `<ul class="fb-others">${q.choices.filter(id => id !== q.answer).map(id => `<li><b>${esc(DICT[id].name)}:</b> ${esc(q.others[id] || "")}</li>`).join("")}</ul>`)
        + `</div>`
        + card("insight", "bulb", "Strategist insight", `<p>${esc(q.insight)}</p>`);
    } else if (mode === "rescue") {
      const best = q.options.find(o => o.rating === "best"), mine = q.options[order[picked]];
      lookId = best.d;
      html = banner(rating, rating === "best" ? "You read the room!" : rating === "ok" ? "Defensible pick!" : "The crowd isn't buying it.", `Best fit: <b>${esc(DICT[best.d].name)}</b>`, base, bonus, coins)
        + meterHTML(pct, rating)
        + (rating !== "best" ? card(rating === "ok" ? "partial" : "mistake", rating === "ok" ? "tilde" : "x", `Your pick: ${esc(DICT[mine.d].name)}`, `<p>${esc(mine.why)}</p>`) : "")
        + card("answer", "check", `${rating === "best" ? "Why it works" : "Rick's best move"}`, `<p class="big">${esc(DICT[best.d].name)}</p><p>${esc(best.why)}</p>`)
        + card("", "chart", "The full breakdown", `<ul class="fb-others">${q.options.filter(o => o !== best && o !== mine).map(o => `<li><b>${esc(DICT[o.d].name)}</b> <span class="verdict-chip ${o.rating}">${o.rating === "ok" ? "Defensible" : "Weak"}</span><br>${esc(o.why)}</li>`).join("")}</ul>`)
        + `<div class="fb-cols">`
        + card("insight", "bulb", "Big takeaway", `<p>${esc(q.lesson)}</p>`)
        + card("twist", "refresh", "Plot twist: change the audience", `<p>${esc(q.twist)}</p>`)
        + `</div>`;
    } else if (mode === "fixit") {
      const best = q.options.find(o => o.rating === "best"), mine = q.options[order[picked]];
      lookId = q.flaw;
      html = banner(rating, rating === "best" ? "Line fixed!" : rating === "ok" ? "Better, but not best." : "Still needs work.", `The problem was <b>${esc(DICT[q.flaw].name)}</b>.`, base, bonus, coins)
        + card("mistake", "flag", `What was wrong: ${esc(DICT[q.flaw].name)}`, `<p>${esc(q.flawWhy)}</p>`)
        + (rating !== "best" ? card(rating === "ok" ? "partial" : "mistake", rating === "ok" ? "tilde" : "x", "Your rewrite", `<p>“${esc(mine.text)}”</p><p>${esc(mine.why)}</p>`) : "")
        + card("answer", "check", "The strongest rewrite", `<p class="big">“${esc(best.text)}”</p><p>${esc(best.why)}</p>`)
        + card("", "chart", "The other rewrites", `<ul class="fb-others">${q.options.filter(o => o !== best && o !== mine).map(o => `<li>“${esc(o.text)}” <span class="verdict-chip ${o.rating}">${o.rating === "ok" ? "Okay" : "Weak"}</span><br>${esc(o.why)}</li>`).join("")}</ul>`)
        + card("insight", "bulb", "Big takeaway", `<p>${esc(q.lesson)}</p>`);
    } else {
      const n = cur.labRatings.filter(r => r === "best").length;
      lookId = q.audiences[0].best;
      html = banner(rating, n === 3 ? "All three rooms, read!" : `${n} of 3 matched`, "Each audience's result is shown above.", base, bonus, coins)
        + meterHTML(pct, rating)
        + card("insight", "bulb", "Big takeaway", `<p>${esc(q.lesson)}</p>`);
    }

    html += `<div class="actions">
      <button class="btn ${rating === "best" ? "mint" : ""}" type="button" id="next">${nextLabel}${icon("arrow")}</button>
      <button class="btn ghost" type="button" id="lookup">${icon("book")}Look up ${esc(DICT[lookId].name)}</button>
    </div>`;

    $("#fb-slot").innerHTML = `<div class="feedback" id="feedback">${html}</div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => { const f = $("#meter-fill"); if (f) f.style.width = pct + "%"; }));
    $("#lookup").onclick = e => openDict(lookId, e.currentTarget);
    $("#next").onclick = () => { sfx("click"); run.i++; nextQuestion(); };
    $("#feedback").scrollIntoView({ behavior: calmMotion() ? "auto" : "smooth", block: "start" });
    $("#next").focus({ preventScroll: true });
  }

  function meterHTML(pct, rating) {
    return `<div class="meter" aria-label="Audience convinced: ${pct} percent">
      <div class="meter-label"><span>Audience convinced</span><b>${pct}%</b></div>
      <div class="meter-track"><div class="meter-fill ${rating}" id="meter-fill"></div></div>
    </div>`;
  }

  /* =========================================================
     EPISODE END / SESSION END
     ========================================================= */
  function rollPrize() {
    let x = Math.random() * PRIZES.reduce((a, p) => a + p.w, 0);
    for (const p of PRIZES) if ((x -= p.w) < 0) return p;
    return PRIZES[0];
  }
  const prizeChip = p => p.t === "coins"
    ? `<span class="prize coins">${icon("coin")}+${p.n} coins</span>`
    : `<span class="prize">${icon(ITEMS.find(i => i.id === p.t).icon)}${esc(ITEMS.find(i => i.id === p.t).name)} ×1</span>`;

  const scoreOf = results => results.reduce((s, r) => s + (r === "best" ? 1 : r === "ok" ? 0.5 : 0), 0);

  function renderEpisodeEnd() {
    const e = run.ep;
    const score = scoreOf(run.results);
    const stars = score >= 4.5 ? 3 : score >= 3.5 ? 2 : score >= 2.5 ? 1 : 0;
    const before = S.badges.length;
    const starCoins = stars * 5;
    S.coins += starCoins; S.coinsEarned += starCoins; run.coins += starCoins;
    S.epStars[e] = Math.max(S.epStars[e] || 0, stars);
    S.epUnlocked = Math.max(S.epUnlocked, Math.min(e + 1, RR_EPISODES.length - 1));
    if (score === PER_EP) award("perfect_ep", true);
    if (run.hints === 0) award("no_hints", true);
    if (e >= 5) award("halfway", true);
    const finale = e === RR_EPISODES.length - 1;
    if (finale) award("graduate", true);
    save(); updateHUD();
    // Prop Box: granted now, revealed when the chest is opened
    const prizes = [];
    for (let k = 0; k < (stars === 3 ? 2 : 1); k++) prizes.push(rollPrize());
    prizes.forEach(p => { if (p.t === "coins") { S.coins += p.n; S.coinsEarned += p.n; } else S.inv[p.t]++; });
    save();
    const earned = S.badges.slice(before).map(id => RR_BADGES.find(b => b.id === id));
    const msg = finale ? RR_RICK.finale : stars >= 3 ? RR_RICK.epEnd.great : stars >= 1 ? RR_RICK.epEnd.good : RR_RICK.epEnd.rough;
    const nextEp = e + 1 < RR_EPISODES.length ? RR_EPISODES[e + 1] : null;
    const strip = run.results.map(r => `<span class="${r}" title="${r === "best" ? "Strong" : r === "ok" ? "Defensible" : "Missed"}">${icon(r === "best" ? "check" : r === "ok" ? "tilde" : "x")}</span>`).join("")
      + (run.bonusRating ? `<span class="bonus" title="Bonus round: ${run.bonusRating === "best" ? "aced" : run.bonusRating === "ok" ? "partial" : "missed"}">${icon(run.bonusRating === "best" ? "star" : run.bonusRating === "ok" ? "tilde" : "x")}</span>` : "");

    screen.innerHTML = `
      <section class="splash">
        <div class="stage">
          <div class="valance"></div><div class="curtain left"></div><div class="curtain right"></div><div class="beam"></div><div class="floor"></div>
          <div class="bubbles"><div class="bubble small" id="end-bubble"></div></div>
          <div class="stage-rick">${rickHTML(stars >= 2 ? "happy" : stars >= 1 ? "wow" : "oops", "bounce")}</div>
          ${audienceHTML(9)}
        </div>
        <div class="copy">
          <div class="epnum-big">${finale ? "Campaign complete" : `Episode ${e + 1} complete`}</div>
          <h1>${esc(RR_EPISODES[e].place)}</h1>
          <div class="big-stars" aria-label="${stars} of 3 stars">${[0, 1, 2].map(i => `<span class="bs" data-star="${i}">${icon("star")}</span>`).join("")}</div>
          <div class="result-strip">${strip}</div>
          <div class="scoreline">
            <div><b>${fmt(score)}/${PER_EP}</b><span>Score</span></div>
            <div><b class="coinnum">${icon("coin")}${run.coins}</b><span>Coins earned</span></div>
            <div><b>${run.hints}</b><span>Hints used</span></div>
          </div>
          <p class="note">Includes ${starCoins} star bonus coins (5 per star).</p>
          <div class="propbox" id="propbox">
            <button class="chest" id="chest" type="button" aria-label="Open your Prop Box">${chestSVG()}</button>
            <div class="pb-txt"><b>Prop Box earned!</b><span id="pb-msg">${prizes.length > 1 ? "Perfect episode: two prizes inside. Tap to open." : "Tap the chest to open it."}</span>
              <div class="pb-prizes" id="pb-prizes" hidden>${prizes.map(prizeChip).join("")}</div></div>
          </div>
          ${earned.length ? `<div class="newbadges">${earned.map((b, i) => `<span class="badge-pill" style="animation-delay:${0.9 + i * 0.15}s"><span class="mini">${icon(b.icon)}</span>${esc(b.name)}</span>`).join("")}</div>` : ""}
          ${nextEp ? `<div class="howto"><span class="mode-icon" style="--mc:${nextEp.mode === "rescue" ? "var(--coral)" : "var(--cobalt)"}">${icon(nextEp.icon)}</span><div><b>Up next, Episode ${e + 2}:</b> ${esc(nextEp.place)}<br><span class="note">${RR_MODES[nextEp.mode].name} · ${LEVEL_NAME[nextEp.level]}</span></div></div>`
            : `<div class="howto"><span class="mode-icon" style="--mc:var(--sun-deep)">${icon("trophy")}</span><div>You finished every episode. Free Play has bonus questions, and your Rematch pile keeps every miss so you can win it back.</div></div>`}
          <div class="cta-row">
            ${nextEp ? `<button class="btn sun big" type="button" id="nextep">${icon("play")}Start Episode ${e + 2}</button>` : ""}
            <button class="btn ghost" type="button" id="shop">${icon("bag")}Prop Shop</button>
            <button class="btn ghost" type="button" id="replay">${icon("refresh")}Replay</button>
            <button class="btn ghost" type="button" id="map">${icon("map")}Map</button>
          </div>
        </div>
      </section>`;
    typeInto($("#end-bubble"), msg, screen.querySelector(".stage .rick"));
    // star reveal
    [...screen.querySelectorAll(".bs")].forEach((s, i) => {
      if (i < stars) setTimeout(() => { s.classList.add("on"); sfx("star", i); if (i === stars - 1 && stars === 3) confetti(innerWidth / 2, innerHeight / 3, 160, 1.7); }, 350 + i * 320);
    });
    const aud = screen.querySelector(".stage .audience");
    if (aud) { const figs = [...aud.querySelectorAll(".aud")]; const won = Math.round((score / PER_EP) * figs.length); shuffle(figs).slice(0, won).forEach(f => f.classList.add("won")); setTimeout(() => aud.classList.add("reacted"), 300); }
    if (finale) setTimeout(() => confetti(innerWidth / 2, innerHeight / 2, 220, 2), 1300);
    const chest = $("#chest");
    chest.onclick = () => {
      if (chest.classList.contains("open") || chest.classList.contains("shake")) return;
      chest.classList.add("shake"); sfx("rattle");
      setTimeout(() => {
        if (!chest.isConnected) { updateHUD(); return; }
        chest.classList.remove("shake"); chest.classList.add("open"); chest.setAttribute("aria-label", "Prop Box opened");
        sfx("chest"); confettiFrom(chest, 70, 1.4);
        $("#pb-prizes").hidden = false; $("#pb-msg").textContent = "Added to your stash!";
        updateHUD();
      }, calmMotion() ? 0 : 700);
    };
    if (nextEp) $("#nextep").onclick = () => { sfx("click"); startEpisode(e + 1); };
    $("#shop").onclick = openShop;
    $("#replay").onclick = () => startEpisode(e);
    $("#map").onclick = renderHome;
    focusScreen();
  }

  function renderDailyEnd() {
    const r = run.results[0] || "weak";
    screen.innerHTML = `
      <section class="splash">
        <div class="stage">
          <div class="valance"></div><div class="curtain left"></div><div class="curtain right"></div><div class="beam"></div><div class="floor"></div>
          <div class="bubbles"><div class="bubble small">${r === "best" ? "Daily challenge: crushed. Same time tomorrow?" : "Tough one! Your streak still counts. See you tomorrow."}</div></div>
          <div class="stage-rick">${rickHTML(r === "best" ? "happy" : "wow", "bounce")}</div>
        </div>
        <div class="copy">
          <div class="epnum-big">Daily Challenge complete</div>
          <div class="daily-big"><span class="daily-flame lit">${icon("flame")}<b>${S.daily.streak}</b></span>
            <div><h1>Day ${S.daily.streak} streak</h1><p class="note">Your best: ${S.daily.best} day${S.daily.best === 1 ? "" : "s"}. Every day you play adds +5 bonus coins (up to +25).</p></div></div>
          <div class="scoreline">
            <div><b class="coinnum">${icon("coin")}${run.coins}</b><span>Coins earned</span></div>
            <div><b>${untilMidnight()}</b><span>Until the next challenge</span></div>
          </div>
          <div class="cta-row">
            <button class="btn sun big" type="button" id="map">${icon("map")}Back to map</button>
            <button class="btn ghost" type="button" id="shop">${icon("bag")}Prop Shop</button>
          </div>
        </div>
      </section>`;
    setTimeout(() => confetti(innerWidth / 2, innerHeight / 3, 90 + S.daily.streak * 10), 250);
    $("#map").onclick = renderHome;
    $("#shop").onclick = () => openShop();
    focusScreen();
  }

  function renderSessionEnd() {
    if (run && run.kind === "daily" && run.results[0]) return renderDailyEnd();
    const res = run.results.concat(run.bonusRating ? [run.bonusRating] : []).filter(Boolean);
    const n = res.length, score = scoreOf(res);
    const good = n && score / n >= 0.75;
    screen.innerHTML = `
      <section class="splash">
        <div class="stage">
          <div class="valance"></div><div class="curtain left"></div><div class="curtain right"></div><div class="beam"></div><div class="floor"></div>
          <div class="bubbles"><div class="bubble small">${n ? (good ? "Look at you go. I'd hire you as my speechwriter." : "Every round makes you sharper. Want to run it back?") : "Leaving already? I was just warming up."}</div></div>
          <div class="stage-rick">${rickHTML(good ? "happy" : "talk", "bounce")}</div>
        </div>
        <div class="copy">
          <div class="epnum-big">${run.kind === "rematch" ? "Rematch complete" : "Free Play session"}</div>
          <h1>${n ? `${fmt(score)} of ${n} strong answers` : "No rounds played"}</h1>
          <div class="scoreline">
            <div><b>${S.xp}</b><span>Total XP</span></div>
            <div><b>${S.bestStreak}</b><span>Best streak</span></div>
            <div><b>${missedIds().length}</b><span>In rematch pile</span></div>
          </div>
          <div class="cta-row">
            ${run.kind === "free" ? `<button class="btn sun big" type="button" id="again">${icon("play")}Keep playing</button>` : ""}
            <button class="btn ghost" type="button" id="map">${icon("map")}Back to map</button>
          </div>
        </div>
      </section>`;
    if (good) setTimeout(() => confetti(innerWidth / 2, innerHeight / 3, 90), 200);
    const again = $("#again");
    if (again) { const r = run; again.onclick = () => { run = r; nextQuestion(); }; }
    $("#map").onclick = renderHome;
    focusScreen();
  }

  /* =========================================================
     PROGRESS
     ========================================================= */
  const BADGE_PROGRESS = {
    streak5: () => [S.bestStreak, 5], streak10: () => [S.bestStreak, 10], red_flag: () => [S.flags, 5],
    fixer: () => [S.fixWins, 3], dict_diver: () => [S.dictSeen.length, 10], daily3: () => [S.daily.best, 3],
    halfway: () => [epsDone(), 6], graduate: () => [epsDone(), 12]
  };

  function renderProgress() {
    run = null; cur = null;
    const { r, idx, next } = rankFor(S.xp);
    const acc = S.answered ? Math.round((S.strong / S.answered) * 100) : 0;
    const rows = RR_CATEGORIES.map(c => ({ key: c.id, name: c.name, ic: CAT_STYLE[c.id].icon, color: CAT_STYLE[c.id].color }))
      .concat([1, 2, 3].map(l => ({ key: "rescue" + l, name: `Reading the Room · Level ${l}`, ic: "megaphone", color: "var(--coral)" })))
      .concat([{ key: "fixit", name: "Fixing Rick's Lines", ic: "wrench", color: "var(--violet)" }, { key: "lab", name: "Audience Lab", ic: "flask", color: "var(--teal)" }])
      .map(x => ({ ...x, m: S.mastery[x.key] }));
    const bar = m => {
      if (!m || !m.total) return `<div class="mbar"><span style="width:0"></span></div>`;
      const p = Math.round((m.right / m.total) * 100);
      return `<div class="mbar"><span class="${p < 50 ? "low" : p < 80 ? "mid" : "high"}" style="width:${p}%"></span></div>`;
    };
    const weakest = rows.filter(x => x.m && x.m.total >= 2 && x.m.right / x.m.total < 0.8).sort((a, b) => a.m.right / a.m.total - b.m.right / b.m.total)[0];
    const played = rows.some(x => x.m && x.m.total);

    screen.innerHTML = `
      <div class="prog-hero">
        <div class="prog-shield">${shieldSVG()}<b>${idx + 1}</b></div>
        <div style="flex:1; min-width:0">
          <div class="eyebrow">Rick's Road to Rhetorical Mastery</div>
          <h1 style="font-size:clamp(36px,5vw,54px);">${esc(r.name)}</h1>
          <p class="note">${next ? `${next.xp - S.xp} XP until ${esc(next.name)}` : "You've reached the top rank."}</p>
        </div>
        <button class="btn mint" type="button" id="teach-top">${icon("chart")}Teacher snapshot</button>
      </div>
      <div class="scoreline" style="margin-bottom:26px;">
        <div><b>${S.xp}</b><span>XP</span></div>
        <div><b class="coinnum">${icon("coin")}${S.coins}</b><span>Coins · ${S.coinsEarned} earned</span></div>
        <div><b>${S.answered}</b><span>Rounds played</span></div>
        <div><b>${acc}%</b><span>Strong answers</span></div>
        <div><b>${S.bestStreak}</b><span>Best streak</span></div>
      </div>
      <div class="prog-grid">
        <div class="panel">
          <h2 style="font-size:26px; margin-bottom:6px;">Skill mastery</h2>
          <p class="note" style="margin-bottom:18px;">${weakest ? `Your toughest area right now: <b>${esc(weakest.name)}</b>. Try it in Free Play, or open those entries in the dictionary.` : played ? "You're strong in everything you've played so far. Keep going to unlock more skills." : "Play a few rounds to see which skills are strongest."}</p>
          <div class="mastery">
            ${rows.map(x => `<div class="mastery-row"><span class="cat-ic" style="--cc:${x.color}">${icon(x.ic)}</span><div><div class="top"><span>${esc(x.name)}</span><span>${x.m && x.m.total ? `${Math.round((x.m.right / x.m.total) * 100)}% · ${x.m.total} played` : "Not yet played"}</span></div>${bar(x.m)}</div></div>`).join("")}
          </div>
        </div>
        <div class="panel">
          <h2 style="font-size:26px; margin-bottom:16px;">Badges · ${S.badges.length}/${RR_BADGES.length}</h2>
          <div class="badges">
            ${RR_BADGES.map(b => {
              const got = S.badges.includes(b.id);
              const pr = !got && BADGE_PROGRESS[b.id] ? BADGE_PROGRESS[b.id]() : null;
              const bar = pr ? `<span class="bprog" aria-label="${Math.min(pr[0], pr[1])} of ${pr[1]}"><span style="width:${Math.min(100, Math.round((pr[0] / pr[1]) * 100))}%"></span></span><small class="bnum">${Math.min(pr[0], pr[1])}/${pr[1]}</small>` : "";
              return `<div class="badge ${got ? "earned" : ""}"><span class="medal-svg"><span class="ribbon"></span><span class="disc">${icon(got ? b.icon : "lock")}</span></span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small>${bar}</div>`;
            }).join("")}
          </div>
          <p class="note" style="margin-top:14px;">Dictionary entries opened: ${S.dictSeen.length}/${RR_DICT.length} · Daily best streak: ${S.daily.best} · Looks owned: ${S.owned.hat.length + S.owned.shirt.length + S.owned.curtain.length}</p>
        </div>
      </div>
      <div class="danger-zone" id="danger">
        <button class="btn ghost small" type="button" id="back">${icon("map")}Back to map</button>
        <button class="btn sun small" type="button" id="shop">${icon("bag")}Prop Shop</button>
        <button class="btn mint small" type="button" id="teach">${icon("chart")}Teacher snapshot</button>
        ${missedIds().length ? `<button class="btn coral small" type="button" id="rem">${icon("refresh")}Rematch ${missedIds().length} missed</button>` : ""}
        <span style="flex:1"></span>
        <button class="linkbtn" type="button" id="reset">Reset all progress</button>
      </div>
      <p class="note" style="margin-top:12px;">${storageOK ? "Progress is saved in this browser on this device." : "This browser isn't allowing saves, so progress lasts only until you close the tab."}</p>`;
    $("#back").onclick = renderHome;
    $("#shop").onclick = () => openShop();
    $("#teach").onclick = openSnapshot;
    $("#teach-top").onclick = openSnapshot;
    const rem = $("#rem"); if (rem) rem.onclick = startRematch;
    $("#reset").onclick = () => {
      $("#danger").innerHTML = `<div class="confirm-row"><b>Erase all XP, coins, items, badges, and stars?</b>
        <button class="btn coral small" type="button" id="yes">Yes, reset</button>
        <button class="btn ghost small" type="button" id="no">Keep my progress</button></div>`;
      $("#yes").onclick = () => { S = fresh(); save(); updateHUD(); renderProgress(); toast("Progress reset. Fresh start!", "refresh"); };
      $("#no").onclick = renderProgress;
      $("#no").focus();
    };
    focusScreen();
  }

  /* =========================================================
     TEACHER SNAPSHOT
     ========================================================= */
  const deviceOf = it => it.mode === "detective" ? it.q.answer
    : it.mode === "rescue" ? it.q.options.find(o => o.rating === "best").d
    : it.mode === "fixit" ? it.q.flaw : null;
  const statusFor = m => {
    if (!m || !m.total) return { cls: "none", label: "Not started" };
    const p = m.right / m.total;
    return p >= 0.8 ? { cls: "best", label: "Strong" } : p >= 0.5 ? { cls: "ok", label: "Developing" } : { cls: "weak", label: "Needs practice" };
  };
  function skillRows() {
    return RR_CATEGORIES.map(c => ({ key: c.id, name: c.name, ic: CAT_STYLE[c.id].icon, color: CAT_STYLE[c.id].color }))
      .concat([1, 2, 3].map(l => ({ key: "rescue" + l, name: `Reading the Room · Level ${l}`, ic: "megaphone", color: "var(--coral)" })))
      .concat([{ key: "fixit", name: "Fixing Rick's Lines", ic: "wrench", color: "var(--violet)" }, { key: "lab", name: "Audience Lab", ic: "flask", color: "var(--teal)" }])
      .map(x => ({ ...x, m: S.mastery[x.key] }));
  }
  function snapshotData() {
    const { r } = rankFor(S.xp);
    const mins = Math.round((S.timeMs || 0) / 60000);
    const miss = {};
    (S.log || []).forEach(e => {
      if (e.r !== "weak" || !QBYID[e.id]) return;
      const d = deviceOf(QBYID[e.id]);
      if (d) miss[d] = (miss[d] || 0) + 1;
    });
    const modes = {};
    (S.log || []).forEach(e => {
      const m = modes[e.m] || (modes[e.m] = { n: 0, s: 0 });
      m.n++; m.s += e.r === "best" ? 1 : e.r === "ok" ? 0.5 : 0;
    });
    const skills = skillRows();
    const played = skills.filter(x => x.m && x.m.total);
    const strongest = played.slice().sort((a, b) => b.m.right / b.m.total - a.m.right / a.m.total)[0];
    return {
      rank: r.name, xp: S.xp, rounds: S.answered,
      acc: S.answered ? Math.round((S.strong / S.answered) * 100) : 0,
      time: mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins} min`,
      eps: epsDone(), stars: totalStars(), badges: S.badges.length, daily: S.daily.best,
      skills, strongest,
      topMiss: Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 4),
      modes, recent: (S.log || []).slice(-8).reverse()
    };
  }
  function snapshotText(d) {
    const lines = [
      "RHETORIC RICK: PROGRESS SNAPSHOT",
      `Student: ${S.name || "(no name entered)"}`,
      `Date: ${new Date().toLocaleString()}`,
      "",
      `Rank: ${d.rank} (${d.xp} XP)`,
      `Rounds played: ${d.rounds} · Strong answers: ${d.acc}% · Time practiced: ${d.time}`,
      `Campaign: ${d.eps}/12 episodes · ${d.stars}/36 stars · Badges: ${d.badges}/${RR_BADGES.length} · Best daily streak: ${d.daily}`,
      "",
      "SKILLS"
    ];
    d.skills.forEach(x => {
      const st = statusFor(x.m);
      lines.push(`- ${x.name}: ${x.m && x.m.total ? `${Math.round((x.m.right / x.m.total) * 100)}% over ${x.m.total} rounds` : "not started"} (${st.label})`);
    });
    lines.push("", "FOCUS NEXT");
    if (d.topMiss.length) d.topMiss.forEach(([id, n]) => lines.push(`- ${DICT[id].name}: missed ${n} time${n === 1 ? "" : "s"}`));
    else lines.push("- No missed devices yet");
    if (d.strongest) lines.push(`Strongest area: ${d.strongest.name}`);
    return lines.join("\n");
  }

  function openSnapshot() {
    sfx("click");
    const d = snapshotData();
    let canPrint = false;
    try { canPrint = window.self === window.top; } catch (e) {}
    const MODE_NAME = { detective: "Detective", rescue: "Rescue", fixit: "Fix-It", lab: "Audience Lab" };
    const kpi = (ic, val, label) => `<div class="rp-kpi"><span class="rp-kpi-ic">${icon(ic)}</span><b>${val}</b><span>${label}</span></div>`;
    const m = openModal(`
      <div class="modal report" role="dialog" aria-modal="true" aria-labelledby="rp-title">
        <div class="rp-head">
          <div>
            <div class="eyebrow">Rhetoric Rick · Teacher snapshot</div>
            <h2 id="rp-title">Progress report</h2>
            <p class="note">Generated ${new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}. This shows progress saved in this browser on this device.</p>
          </div>
          <button type="button" class="iconbtn rp-x" id="rp-x" aria-label="Close the report">${icon("x")}</button>
        </div>
        <div class="rp-body">
          <label class="rp-name" for="rp-name">Student name
            <input id="rp-name" type="text" maxlength="40" autocomplete="off" placeholder="Optional: type a name for the report" value="${esc(S.name || "")}"></label>
          <div class="rp-kpis">
            ${kpi("shield", esc(d.rank), `${d.xp} XP`)}
            ${kpi("target", d.rounds, "Rounds played")}
            ${kpi("check", d.acc + "%", "Strong answers")}
            ${kpi("refresh", d.time, "Time practiced")}
            ${kpi("map", `${d.eps}/12`, "Episodes")}
            ${kpi("star", `${d.stars}/36`, "Stars")}
            ${kpi("trophy", `${d.badges}/${RR_BADGES.length}`, "Badges")}
            ${kpi("flame", d.daily, "Best daily streak")}
          </div>
          <div class="rp-cols">
            <section>
              <h3>Skills</h3>
              <table class="rp-table">
                <thead><tr><th scope="col">Skill</th><th scope="col">Rounds</th><th scope="col">Score</th><th scope="col">Status</th></tr></thead>
                <tbody>${d.skills.map(x => { const st = statusFor(x.m); const p = x.m && x.m.total ? Math.round((x.m.right / x.m.total) * 100) : null;
                  return `<tr><td><span class="cat-ic sm" style="--cc:${x.color}">${icon(x.ic)}</span>${esc(x.name)}</td><td>${x.m ? x.m.total : 0}</td><td>${p == null ? "–" : p + "%"}</td><td><span class="pill ${st.cls}">${st.label}</span></td></tr>`; }).join("")}</tbody>
              </table>
            </section>
            <section class="rp-side">
              <h3>Focus next</h3>
              ${d.topMiss.length ? `<ul class="rp-miss">${d.topMiss.map(([id, n]) => `<li><button type="button" class="linkbtn" data-dict="${id}">${esc(DICT[id].name)}</button><span>missed ${n}×</span></li>`).join("")}</ul>`
                : `<p class="note">No missed devices yet.</p>`}
              ${d.strongest ? `<p class="rp-strong">${icon("star")}Strongest area: <b>${esc(d.strongest.name)}</b></p>` : ""}
              <h3>By mode</h3>
              <ul class="rp-modes">${["detective", "rescue", "fixit", "lab"].map(k => { const mm = d.modes[k]; return `<li><span>${MODE_NAME[k]}</span><b>${mm ? Math.round((mm.s / mm.n) * 100) + "%" : "–"}</b><small>${mm ? mm.n + " rounds" : "not played"}</small></li>`; }).join("")}</ul>
              <h3>Recent activity</h3>
              ${d.recent.length ? `<ul class="rp-recent">${d.recent.map(e => { const it = QBYID[e.id]; return `<li><span class="verdict-chip ${e.r}">${e.r === "best" ? "Strong" : e.r === "ok" ? "Partial" : "Missed"}</span><span class="rp-t">${it ? esc(it.q.title) : esc(e.id)}</span><small>${MODE_NAME[e.m] || ""} · ${new Date(e.t).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></li>`; }).join("")}</ul>`
                : `<p class="note">No rounds played yet.</p>`}
            </section>
          </div>
          <div id="rp-copybox"></div>
        </div>
        <div class="rp-actions">
          <button class="btn sun" type="button" id="rp-copy">${icon("check")}Copy summary</button>
          ${canPrint ? `<button class="btn ghost" type="button" id="rp-print">Print</button>` : ""}
          <button class="btn ghost" type="button" id="rp-close">Close</button>
        </div>
      </div>`);
    m.querySelector("#rp-name").addEventListener("input", e => { S.name = e.target.value.slice(0, 40); save(); });
    m.querySelector("#rp-x").onclick = () => closeModal();
    m.querySelector("#rp-close").onclick = () => closeModal();
    m.querySelectorAll("[data-dict]").forEach(b => (b.onclick = () => { closeModal(true); openDict(b.dataset.dict); }));
    const pr = m.querySelector("#rp-print"); if (pr) pr.onclick = () => window.print();
    m.querySelector("#rp-copy").onclick = e => {
      const text = snapshotText(snapshotData());
      const btn = e.currentTarget;
      const fallback = () => {
        const box = m.querySelector("#rp-copybox");
        box.innerHTML = `<p class="note">Copying isn't allowed here. Select the text below and copy it yourself.</p><textarea class="rp-text" readonly rows="10"></textarea>`;
        const ta = box.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
      };
      try {
        navigator.clipboard.writeText(text).then(() => { btn.innerHTML = `${icon("check")}Copied!`; sfx("coin"); }, fallback);
      } catch (err) { fallback(); }
    };
  }

  /* =========================================================
     DICTIONARY DRAWER
     ========================================================= */
  const dict = $("#dict"), scrim = $("#dict-scrim"), dsearch = $("#dict-search");
  let dictCat = "all", dictOpener = null, dictOpenId = null, dictView = "browse", dictSort = "cat";
  let fc = { id: null, flipped: false, seen: 0 };
  const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";

  function highlight(text, id) {
    const h = esc(text);
    const words = (window.RR_HL && RR_HL[id]) || [];
    if (!words.length) return h;
    const re = new RegExp(words.map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length).join("|"), "g");
    return h.replace(re, m => `<mark>${m}</mark>`);
  }
  function practicePool(id) {
    return RR_DETECTIVE.filter(q => q.answer === id).map(q => ({ q, mode: "detective" }))
      .concat(RR_RESCUE.filter(q => q.options.some(o => o.rating === "best" && o.d === id)).map(q => ({ q, mode: "rescue" })))
      .concat(RR_FIXIT.filter(q => q.flaw === id).map(q => ({ q, mode: "fixit" })));
  }
  function deviceRecord(id) {
    const tried = practicePool(id).filter(it => S.history[it.q.id]);
    return { tried: tried.length, right: tried.filter(it => S.history[it.q.id].last === "best").length };
  }
  function speak(text) {
    if (!canSpeak) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {}
  }
  function startPractice(id) {
    const pool = practicePool(id);
    if (!pool.length) return;
    closeDict();
    run = { kind: "free", mode: "practice", level: 0, pool, queue: shuffle(pool), i: 0, results: [], hints: 0, coins: 0, practice: id };
    nextQuestion();
  }

  function filteredDict() {
    const term = dsearch.value.trim().toLowerCase();
    const match = d => !term || [d.name, d.short, d.definition, d.aka || "", d.example].join(" ").toLowerCase().includes(term);
    return RR_DICT.filter(d => (dictCat === "all" || d.cat === dictCat) && match(d));
  }

  function renderDictModes() {
    $("#dict-modes").innerHTML = `
      <div class="seg" role="tablist" aria-label="Dictionary view">
        <button type="button" role="tab" data-view="browse" aria-selected="${dictView === "browse"}">${icon("book")}Browse</button>
        <button type="button" role="tab" data-view="cards" aria-selected="${dictView === "cards"}">${icon("sparkles")}Flashcards</button>
      </div>
      ${dictView === "browse" ? `<button type="button" class="sortbtn" id="dict-sort" aria-label="Change sort order">${icon("route")}${dictSort === "cat" ? "By category" : "A to Z"}</button>` : `<span class="fc-count">${fc.seen} studied</span>`}`;
    $("#dict-modes").querySelectorAll("[data-view]").forEach(b => (b.onclick = () => {
      dictView = b.dataset.view; sfx("click"); fc = { id: null, flipped: false, seen: fc.seen };
      renderDictModes(); renderDictBody();
    }));
    const sb = $("#dict-sort");
    if (sb) sb.onclick = () => { dictSort = dictSort === "cat" ? "az" : "cat"; sfx("click"); renderDictModes(); renderDictBody(); };
  }

  function renderDictCats() {
    $("#dict-cats").innerHTML = [{ id: "all", name: "All" }].concat(RR_CATEGORIES)
      .map(c => `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${dictCat === c.id}" style="--cc:${CAT_STYLE[c.id]?.color || "var(--muted)"}">${c.id !== "all" ? icon(CAT_STYLE[c.id].icon) : ""}${esc(c.name)}</button>`).join("");
    $("#dict-cats").querySelectorAll(".chip").forEach(b => (b.onclick = () => { dictCat = b.dataset.cat; sfx("click"); fc.id = null; renderDictCats(); renderDictBody(); }));
  }

  function entryHTML(d) {
    const open = d.id === dictOpenId;
    const vs = d.vs && DICT[d.vs.id];
    const red = d.cat === "redflags";
    const pool = open ? practicePool(d.id) : [];
    const rec = open ? deviceRecord(d.id) : null;
    return `<div class="dentry" id="de-${d.id}" style="--cc:${CAT_STYLE[d.cat].color}">
      <button type="button" aria-expanded="${open}" data-entry="${d.id}">
        <span class="dn">${esc(d.name)}${d.say ? `<small>${esc(d.say)}</small>` : ""}${d.aka ? `<small>aka ${esc(d.aka)}</small>` : ""}${S.dictSeen.includes(d.id) ? `<span class="seen" title="You've opened this one"></span>` : ""}</span>
        <span class="ds">${esc(d.short)}</span>
        <span class="chev">${icon("arrow")}</span>
      </button>
      ${open ? `<div class="ddetail">
        <div class="dtools">
          ${canSpeak ? `<button type="button" class="tool" data-say="${esc(d.name)}">${icon("volume")}Hear it</button>` : ""}
          <span class="dcat-tag" style="--cc:${CAT_STYLE[d.cat].color}">${icon(CAT_STYLE[d.cat].icon)}${esc(CAT[d.cat].name)}</span>
        </div>
        <p>${esc(d.definition)}</p>
        <div class="ex"><span class="ex-label">Example · highlighted words show the device</span>${highlight(d.example, d.id)}</div>
        <dl>
          <div class="wide"><dt>How to spot it</dt><dd>${esc(d.how)}</dd></div>
          <div><dt>Effect on the audience</dt><dd>${esc(d.effect)}</dd></div>
          <div><dt>${red ? "Should Rick use it?" : "Useful when"}</dt><dd>${esc(d.useWhen)}</dd></div>
          <div class="wide warn"><dt>Watch out</dt><dd>${esc(d.watchOut)}</dd></div>
        </dl>
        ${vs ? `<div class="vs"><span class="vs-badge">VS</span><div><b>Don't mix it up with <button type="button" class="linkbtn" data-jump="${vs.id}">${esc(vs.name)}</button></b><span>${esc(d.vs.note)}</span></div></div>` : ""}
        ${pool.length ? `<div class="dpractice">
          <div><b>Your record</b><span>${rec.tried ? `${rec.right} of ${rec.tried} right so far` : "Not practiced yet"} · ${pool.length === 1 ? "1 question uses" : pool.length + " questions use"} this device</span></div>
          <button type="button" class="btn small" data-practice="${d.id}">${icon("play")}Practice ${esc(d.name)}</button>
        </div>` : ""}
      </div>` : ""}
    </div>`;
  }

  function renderFlash(list) {
    if (!list.length) return `<p class="note">No devices match. Try a different category or search.</p>`;
    if (!fc.id || !list.some(d => d.id === fc.id)) fc = { id: pick(list).id, flipped: false, seen: fc.seen };
    const d = DICT[fc.id];
    return `<div class="flash ${fc.flipped ? "flipped" : ""}" style="--cc:${CAT_STYLE[d.cat].color}">
      <div class="flash-card" aria-live="polite">
        <span class="dcat-tag" style="--cc:${CAT_STYLE[d.cat].color}">${icon(CAT_STYLE[d.cat].icon)}${esc(CAT[d.cat].name)}</span>
        ${fc.flipped
          ? `<div class="flash-name">${esc(d.name)}${d.say ? `<small>${esc(d.say)}</small>` : ""}</div>
             <p class="flash-short">${esc(d.short)}</p>
             <div class="ex">${highlight(d.example, d.id)}</div>`
          : `<div class="flash-q">Which device is this?</div>
             <div class="ex big">${esc(d.example)}</div>
             <p class="note">Say your answer out loud, then flip the card.</p>`}
      </div>
      <div class="flash-actions">
        ${fc.flipped
          ? `<button type="button" class="btn" id="fc-next">${icon("arrow")}Next card</button>
             <button type="button" class="btn ghost small" id="fc-open">${icon("book")}Open entry</button>`
          : `<button type="button" class="btn sun" id="fc-flip">${icon("refresh")}Flip card</button>
             <button type="button" class="btn ghost small" id="fc-skip">Skip</button>`}
      </div>
    </div>`;
  }

  function renderDictBody() {
    const list = filteredDict();
    const body = $("#dict-body");
    if (dictView === "cards") {
      body.innerHTML = renderFlash(list);
      const flip = $("#fc-flip"), nextB = $("#fc-next"), skip = $("#fc-skip"), openB = $("#fc-open");
      if (flip) flip.onclick = () => { fc.flipped = true; fc.seen++; markSeen(fc.id); sfx("ok"); renderDictModes(); renderDictBody(); $("#fc-next")?.focus(); };
      const advance = () => { const others = list.filter(d => d.id !== fc.id); fc = { id: (others.length ? pick(others) : list[0]).id, flipped: false, seen: fc.seen }; sfx("whoosh"); renderDictBody(); $("#fc-flip")?.focus(); };
      if (nextB) nextB.onclick = advance;
      if (skip) skip.onclick = advance;
      if (openB) openB.onclick = () => { const id = fc.id; dictView = "browse"; renderDictModes(); jumpTo(id); };
      return;
    }
    let html = "";
    if (dictSort === "az") {
      html = list.slice().sort((a, b) => a.name.localeCompare(b.name)).map(entryHTML).join("");
    } else {
      RR_CATEGORIES.forEach(c => {
        const items = list.filter(d => d.cat === c.id);
        if (!items.length) return;
        html += `<div class="dcat"><span class="cat-ic" style="--cc:${CAT_STYLE[c.id].color}">${icon(CAT_STYLE[c.id].icon)}</span><div><b>${esc(c.name)}</b><small>${esc(c.blurb)}</small></div></div>${items.map(entryHTML).join("")}`;
      });
    }
    body.innerHTML = html || `<p class="note">No devices match “${esc(dsearch.value)}”. Try a shorter word, or choose All.</p>`;
    body.querySelectorAll("[data-entry]").forEach(b => (b.onclick = () => toggleEntry(b.dataset.entry)));
    body.querySelectorAll("[data-jump]").forEach(b => (b.onclick = () => jumpTo(b.dataset.jump)));
    body.querySelectorAll("[data-say]").forEach(b => (b.onclick = () => speak(b.dataset.say)));
    body.querySelectorAll("[data-practice]").forEach(b => (b.onclick = () => startPractice(b.dataset.practice)));
  }

  function markSeen(id) {
    if (!S.dictSeen.includes(id)) {
      S.dictSeen.push(id);
      if (S.dictSeen.length >= 10) award("dict_diver");
      save();
    }
  }
  function toggleEntry(id) {
    dictOpenId = dictOpenId === id ? null : id;
    if (dictOpenId) markSeen(id);
    sfx("click");
    renderDictBody();
    document.getElementById("de-" + id)?.querySelector("button").focus();
  }
  function jumpTo(id) {
    dictCat = "all"; dsearch.value = ""; dictOpenId = id; dictView = "browse"; markSeen(id);
    renderDictModes(); renderDictCats(); renderDictBody();
    const el = document.getElementById("de-" + id);
    if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("flash"); el.querySelector("button").focus(); }
  }
  function openDict(id, opener) {
    dictOpener = opener || document.activeElement;
    dict.hidden = false; scrim.hidden = false;
    document.body.style.overflow = "hidden";
    sfx("whoosh");
    if (id) jumpTo(id);
    else { renderDictModes(); renderDictCats(); renderDictBody(); dsearch.focus(); }
  }
  function closeDict() {
    if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {}
    dict.hidden = true; scrim.hidden = true;
    document.body.style.overflow = "";
    if (dictOpener && document.contains(dictOpener)) dictOpener.focus();
  }
  dsearch.addEventListener("input", () => { dictOpenId = null; renderDictBody(); });
  $("#dict-close").onclick = closeDict;
  scrim.onclick = closeDict;

  /* =========================================================
     GLOBAL CONTROLS
     ========================================================= */
  $("#btn-home").onclick = () => { sfx("click"); renderHome(); };
  $("#btn-dict").onclick = e => openDict(null, e.currentTarget);
  $("#btn-progress").onclick = () => { sfx("click"); renderProgress(); };
  $("#coinchip").onclick = openShop;
  $("#btn-sound").onclick = () => { toggleSound(); updateHUD(); };

  document.addEventListener("keydown", e => {
    if ($("#modal")) { if (e.key === "Escape") closeModal(); return; }
    if (!dict.hidden) { if (e.key === "Escape") closeDict(); return; }
    if (!cur || e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!screen.querySelector(".play")) return;
    const k = e.key.toLowerCase();
    const map = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 };
    if (!cur.locked && cur.mode !== "lab" && k in map && map[k] < cur.order.length) { e.preventDefault(); select(map[k]); }
    else if (k === "enter" && e.target.tagName !== "BUTTON") {
      if (!cur.locked && !$("#submit").disabled) { e.preventDefault(); submit(); }
      else if (cur.locked && $("#next")) { e.preventDefault(); $("#next").click(); }
    }
  });

  applyLook();
  updateHUD();
  renderHome();
})();

</script>
</body>
</html>
